sonar.projectKey=OOPSLY::AUTH
sonar.organization=tanhao111


# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=OOPSLY::AUTH
#sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=\
  **/*_test.go,\
  **/testutil/**,\
  **/vendor/**,\
  **/scripts/**,\
  **/*.sql,\
  **/*.html

sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage comes from scripts/coverage.sh (go test -coverprofile). cmd/ only wires the
# process together and is not unit tested, like ApiApplication in the API module.
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=\
  cmd/**,\
  **/testutil/**


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8