# Local dev infrastructure shared by app/api, app/auth and app/game,
# plus an nginx gateway (app/nginx) on http://localhost:8080.
# Run from app/:  docker compose up -d --build
services:
  postgres:
    image: postgres:15.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oopsly}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped

  # S3-compatible store for profile pictures (bucket oopsly-avatars, private).
  # S3 API on http://localhost:9000, console on http://localhost:9001
  # (minioadmin / minioadmin). Local-only credentials.
  s3:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      # Browsers upload straight to the store, so it must allow the app origins.
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3data:/data
    networks:
      - app-network
    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "for i in $$(seq 1 30); do
      aws --endpoint-url http://s3:9000 s3api create-bucket --bucket oopsly-avatars
      >/dev/null 2>&1 || aws --endpoint-url http://s3:9000 s3api head-bucket --bucket oopsly-avatars
      >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1"
    networks:
      - app-network

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  s3data:

networks:
  app-network:
    driver: bridge
