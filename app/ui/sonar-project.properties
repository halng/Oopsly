sonar.projectKey=Oopsly::UI
sonar.organization=tanhao111
sonar.projectName=Oopsly::UI
sonar.projectVersion=1.0

# Paths are relative to this file (ui/).
sonar.sources=app,screen,components,services,store,utils,hooks,constants
sonar.tests=__tests__
sonar.test.inclusions=**/__tests__/**/*.{ts,tsx,js,jsx}

sonar.exclusions=\
  **/node_modules/**,\
  **/.expo/**,\
  **/coverage/**,\
  **/coverage-*/**,\
  **/.nyc_output/**,\
  **/cypress/**,\
  **/__mocks__/**,\
  **/temp/**,\
  **/scripts/**,\
  **/*.config.js,\
  **/*.config.cjs,\
  **/*.config.ts,\
  **/expo-env.d.ts,\
  **/nativewind-env.d.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# Prefer merged Jest+Cypress report from CI; fall back to Jest-only locally.
sonar.javascript.lcov.reportPaths=coverage-combined/lcov.info,coverage/lcov.info
