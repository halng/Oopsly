sonar.projectKey=OOPSLY::GAME
sonar.organization=tanhao111

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=OOPSLY::GAME
#sonar.projectVersion=1.0

# Paths are relative to this file. Tests are analysed as tests, not as sources,
# so their repeated arrange/act/assert blocks do not count as duplication.
sonar.sources=app,alembic
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Generated migrations are long column lists that mirror the models.
sonar.exclusions=alembic/versions/**,**/*.egg-info/**
sonar.cpd.exclusions=alembic/**

sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=alembic/**
