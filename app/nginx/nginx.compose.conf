# Gateway for docker-compose-build.yaml: same routes as nginx.conf, but the
# upstreams are the compose services instead of processes on the host.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web  { server web:3000; }
upstream api  { server api:9009; }
upstream game { server game:9008; }
upstream auth { server auth:9010; }

server {
    listen 80;
    server_name localhost;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;

    location /api/auth/        { proxy_pass http://auth; }
    location /.well-known/     { proxy_pass http://auth; }
    location /api/oopsly/      { proxy_pass http://api; }
    location /v1/game/         { proxy_pass http://game; }

    # Next.js dev server (pages, HMR websocket)
    location /                 { proxy_pass http://web; }
}
