sonar.projectKey=Quizi::NOTI
sonar.organization=tanhao111

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Quizi::NOTI
#sonar.projectVersion=1.0

# Paths are relative to this file. Tests are analysed as tests, not as sources,
# so their repeated arrange/act/assert blocks do not count as duplication.
sonar.sources=noti
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# The email templates are HTML, not code to analyse.
sonar.exclusions=**/*.html,**/*.egg-info/**

sonar.python.coverage.reportPaths=coverage.xml
