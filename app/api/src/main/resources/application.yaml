server:
  port: 9009
  servlet:
    context-path: /api/oopsly

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:8081}
  jwt:
    # The auth service signs tokens (RS256) and publishes its public keys here; this service only verifies them.
    jwks-url: ${JWKS_URL:http://localhost:9010/.well-known/pub.json}
  auth:
    base-url: ${AUTH_BASE_URL:http://localhost:9010/api/auth}
    internal-key: ${AUTH_INTERNAL_KEY:changeme}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    model: ${AI_MODEL:gemini-2.5-flash}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    operationsSorter: method

spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=10m
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude: org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration
  application:
    name: api
  main:
    allow-bean-definition-overriding: true

  datasource:
    password: ${DB_PASSWORD:postgres}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oopsly}
    username: ${DB_USERNAME:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 2000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        default_schema: cms
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: cms

resilience4j:
    circuitbreaker:
        configs:
          default:
            registerHealthIndicator: true
            slidingWindowSize: 100
            minimumNumberOfCalls: 10
            failureRateThreshold: 50
            waitDurationInOpenState: 5s
            record-exceptions:
              - java.io.IOException                       # Network/File IO issues
              - java.util.concurrent.TimeoutException     # Processing took too long
              - org.springframework.dao.DataAccessException # Covers most DB/JDBC errors (Spring)
              - org.springframework.data.redis.RedisConnectionFailureException # Redis down
              - org.springframework.web.client.HttpServerErrorException # Downstream service returned 500
              - org.springframework.web.client.ResourceAccessException # Downstream unreachable or timed out
            ignore-exceptions:
              - org.springframework.web.client.HttpClientErrorException # Downstream returned 400-404
              - com.app.oopsly.api.shared.exception.NotFoundException   # Your custom input validation
              - com.app.oopsly.api.shared.exception.UnauthenticatedException
              - com.app.oopsly.api.shared.exception.ValidationException
              - com.app.oopsly.api.shared.exception.RetryLaterException
              - java.lang.IllegalArgumentException        # Basic Java argument errors
        instances:
          authClientCircuitBreaker:
            baseConfig: default
          collectionServiceCircuitBreaker:
            baseConfig: default
          cardServiceCircuitBreaker:
            baseConfig: default
          deckServiceCircuitBreaker:
            baseConfig: default
          testSuiteServiceCircuitBreaker:
            baseConfig: default
          questionServiceCircuitBreaker:
            baseConfig: default
          subjectServiceCircuitBreaker:
            baseConfig: default
          shelveServiceCircuitBreaker:
            baseConfig: default
          communityServiceCircuitBreaker:
            baseConfig: default
          leaderboardServiceCircuitBreaker:
            baseConfig: default
          gardenServiceCircuitBreaker:
            baseConfig: default
          quizServiceCircuitBreaker:
            baseConfig: default
          statsServiceCircuitBreaker:
            baseConfig: default
          discoverServiceCircuitBreaker:
            baseConfig: default
          aiServiceCircuitBreaker:
            baseConfig: default
