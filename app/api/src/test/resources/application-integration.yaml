app:
  allowed-origins: http://localhost:8081
  jwt:
    # Tests replace the key provider, so nothing is fetched from this URL.
    jwks-url: http://localhost:1/.well-known/pub.json
  auth:
    base-url: http://localhost:1/api/auth
    internal-key: integration-key

server:
  port: 0
  active:
    version: v1
  servlet:
    context-path: /api/oopsly

spring:
  main:
    allow-bean-definition-overriding: true
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:oopsly_integration;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=INTERVAL,VALUE,YEAR,MONTH,DAY
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        globally_quoted_identifiers: true
        globally_quoted_identifiers_skip_column_definitions: true
  flyway:
    enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: ${EMBEDDED_REDIS_PORT:6379}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: false
        slidingWindowSize: 100
        minimumNumberOfCalls: 100
        failureRateThreshold: 100
        waitDurationInOpenState: 1s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - com.app.oopsly.api.shared.exception.NotFoundException
          - com.app.oopsly.api.shared.exception.UnauthenticatedException
          - com.app.oopsly.api.shared.exception.ValidationException
          - com.app.oopsly.api.shared.exception.RetryLaterException
          - java.lang.IllegalArgumentException

management:
  health:
    redis:
      enabled: false

logging:
  level:
    root: WARN
    com.app.oopsly.api: INFO
