# Real Postgres and Redis come from Testcontainers; only the shape of the app is set here.
app:
  allowed-origins: http://localhost:8081
  jwt:
    # Same secret the Locust suite signs its tokens with by default.
    secret: 057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86
  auth:
    # No auth service in the loop: profile lookups fall back to placeholders.
    base-url: http://localhost:1/api/auth
    internal-key: perf-key

server:
  port: 0
  servlet:
    context-path: /api/oopsly

spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

management:
  health:
    redis:
      enabled: true

logging:
  level:
    root: WARN
    com.app.oopsly.api: WARN
    locust: INFO
