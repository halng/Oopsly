AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Quizi noti service: a Lambda that auth invokes directly with a template name and its
  data (always including the recipient's name), renders the email and sends it through the
  Resend API (OTP codes, welcome, community invites, study calendar events).

Parameters:
  Environment:
    Type: String
    Default: stg
    AllowedPattern: "[a-z0-9-]+"
  AppUrl:
    Type: String
    Default: https://quizi.tech
    Description: Web app address used for links in emails.

Resources:
  # Holds api_key and from_email as JSON. Created with a placeholder; deploy.sh fills it
  # from RESEND_API_KEY / RESEND_FROM, and later deploys leave the value alone.
  ResendSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub quizi-${Environment}-resend
      SecretString: '{"api_key":"","from_email":""}'

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/quizi-noti-${Environment}
      RetentionInDays: 14

  Function:
    Type: AWS::Serverless::Function
    DependsOn: LogGroup
    Properties:
      # The name is fixed: auth builds the function ARN from it.
      FunctionName: !Sub quizi-noti-${Environment}
      Description: Renders Quizi email templates and sends them through Resend
      CodeUri: ../app/noti/
      Handler: noti.handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          RESEND_SECRET_ARN: !Ref ResendSecret
          APP_URL: !Ref AppUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ResendSecret
      # Callers invoke asynchronously; Lambda retries a failed send twice, then drops it.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600

Outputs:
  FunctionName:
    Value: !Ref Function
  FunctionArn:
    Value: !GetAtt Function.Arn
  ResendSecretArn:
    Value: !Ref ResendSecret
