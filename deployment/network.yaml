AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Quizi shared infrastructure: VPC, ECS cluster, Postgres, Redis, ECR repositories,
  generated secrets and the HTTP API (API Gateway) that fronts every service, with its
  custom domains (api.quizi.tech, ws.quizi.tech) in Route 53. The web app's record (quizi.tech)
  is managed by hand, outside this stack.
  Deploy this stack first; auth, api and game import its outputs.

Parameters:
  Environment:
    Type: String
    Default: stg
    AllowedPattern: "[a-z0-9-]+"
  DbEngineVersion:
    Type: String
    Default: "18.6"
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  RedisEngineVersion:
    Type: String
    Default: "7.1"
  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://quizi.tech
    Description: Browser origins allowed to upload profile pictures straight to S3.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone of quizi.tech. Leave empty to skip custom domains.
  ApiDomainName:
    Type: String
    Default: ""
    Description: Domain the HTTP API answers on, e.g. api.quizi.tech. Needs HostedZoneId.
  WsDomainName:
    Type: String
    Default: ""
    Description: Domain the WebSocket endpoints answer on, e.g. ws.quizi.tech. Needs HostedZoneId.

Conditions:
  HasApiDomain: !And
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Not [!Equals [!Ref ApiDomainName, ""]]
  HasWsDomain: !And
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Not [!Equals [!Ref WsDomainName, ""]]

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub quizi-${Environment}

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Tasks get a public IP so they can pull images and reach AWS APIs without a NAT
  # gateway. Nothing is reachable from the internet: security groups only admit
  # traffic from the VPC link, the load balancers and the tasks themselves.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.40.0.0/24
      MapPublicIpOnLaunch: true

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.40.1.0/24
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicRouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # --------------------------------------------------------- security groups
  VpcLinkSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API Gateway VPC link; the only caller the internal load balancers accept
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  # Shared by every service. Each service template adds its own ingress rule from
  # its load balancer.
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Quizi Fargate tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres accepts Quizi tasks only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis accepts Quizi tasks only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref TaskSecurityGroup

  # ---------------------------------------------------------------- secrets
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub quizi-${Environment}-db
      GenerateSecretString:
        SecretStringTemplate: '{"username":"quizi"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # Shared by auth (INTERNAL_API_KEY) and api (AUTH_INTERNAL_KEY), so they always agree.
  InternalKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub quizi-${Environment}-internal-key
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  JwtPassphraseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub quizi-${Environment}-jwt-passphrase
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  GameDatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub quizi-${Environment}-game-database-url
      SecretString: !Sub
        - "postgresql+psycopg://quizi:${Password}@${Host}:5432/quizi"
        - Password: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
          Host: !GetAtt Database.Endpoint.Address

  # --------------------------------------------------------- data stores
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Quizi database subnets
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub quizi-${Environment}
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: quizi
      MasterUsername: quizi
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7

  RedisSubnets:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Quizi Redis subnets
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  Redis:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: !Sub quizi-${Environment}
      Engine: redis
      EngineVersion: !Ref RedisEngineVersion
      CacheNodeType: !Ref RedisNodeType
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref RedisSubnets
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup

  # One log group for every service; each task logs to the stream <service>/<container>/<task>.
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /quizi/${Environment}
      RetentionInDays: 14

  # ------------------------------------------------------------ containers
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub quizi-${Environment}

  AuthRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub quizi-auth-${Environment}
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub quizi-api-${Environment}
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  GameRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub quizi-game-${Environment}
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  # ------------------------------------------------------------ API Gateway
  # One HTTP API for all services. CORS is left to the services themselves, so
  # browsers never see duplicated headers. Services attach their own routes.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub quizi-${Environment}
      ProtocolType: HTTP

  VpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub quizi-${Environment}
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroupIds:
        - !Ref VpcLinkSecurityGroup

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /apigateway/quizi-${Environment}
      RetentionInDays: 14

  # No routes yet, so the first stage deployment needs the services' routes to exist
  # only for traffic; the stage itself is valid empty. AutoDeploy publishes route
  # changes made by the service stacks.
  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}

  # ------------------------------------------------------------ custom domains
  # api.quizi.tech: a certificate validated through Route 53, a custom domain on the HTTP
  # API (regional, so the certificate lives in this region) and an alias record to it.
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ApiDomainName
          HostedZoneId: !Ref HostedZoneId

  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomain
      Stage: !Ref DefaultStage

  ApiRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasApiDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomain.RegionalHostedZoneId

  # ------------------------------------------------------------ WebSocket entry
  # The HTTP API cannot upgrade a connection, so the two socket endpoints (api: STOMP at
  # /api/quizi/ws, game: /v1/game/ws) are reached through this public load balancer instead.
  # Each service stack adds a listener rule that forwards its socket path to its tasks.
  # Without WsDomainName the listener is plain HTTP, which is only fit for non-prod.
  SocketSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public load balancer for the WebSocket endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !If [HasWsDomain, 443, 80]
          ToPort: !If [HasWsDomain, 443, 80]
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  SocketLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub quizi-ws-${Environment}
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !GetAtt SocketSecurityGroup.GroupId
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        # Connections stay open for a whole quiz; STOMP heartbeats keep them alive anyway.
        - Key: idle_timeout.timeout_seconds
          Value: "3600"

  WsCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasWsDomain
    Properties:
      DomainName: !Ref WsDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref WsDomainName
          HostedZoneId: !Ref HostedZoneId

  SocketListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref SocketLoadBalancer
      Port: !If [HasWsDomain, 443, 80]
      Protocol: !If [HasWsDomain, HTTPS, HTTP]
      Certificates: !If
        - HasWsDomain
        - - CertificateArn: !Ref WsCertificate
        - !Ref AWS::NoValue
      SslPolicy: !If [HasWsDomain, ELBSecurityPolicy-TLS13-1-2-2021-06, !Ref AWS::NoValue]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: Not found

  SocketRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasWsDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WsDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SocketLoadBalancer.DNSName
        HostedZoneId: !GetAtt SocketLoadBalancer.CanonicalHostedZoneID

  # ---------------------------------------------------------------- avatars
  # Private: pictures are only reachable through short-lived presigned URLs.
  AvatarBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub quizi-avatar-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [GET, POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

Outputs:
  AvatarBucketName:
    Value: !Ref AvatarBucket
    Export:
      Name: !Sub ${AWS::StackName}-AvatarBucketName
  AvatarBucketArn:
    Value: !GetAtt AvatarBucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-AvatarBucketArn
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub ${AWS::StackName}-VpcId
  SubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export:
      Name: !Sub ${AWS::StackName}-SubnetIds
  ClusterName:
    Value: !Ref Cluster
    Export:
      Name: !Sub ${AWS::StackName}-ClusterName
  SocketListenerArn:
    Value: !Ref SocketListener
    Export:
      Name: !Sub ${AWS::StackName}-SocketListenerArn
  SocketSecurityGroupId:
    Value: !GetAtt SocketSecurityGroup.GroupId
    Export:
      Name: !Sub ${AWS::StackName}-SocketSecurityGroupId
  SocketUrl:
    Description: Base URL of the WebSocket endpoints. Set the web app's NEXT_PUBLIC_WS_URL to it.
    Value: !If
      - HasWsDomain
      - !Sub https://${WsDomainName}
      - !Sub http://${SocketLoadBalancer.DNSName}
  TaskSecurityGroupId:
    Value: !GetAtt TaskSecurityGroup.GroupId
    Export:
      Name: !Sub ${AWS::StackName}-TaskSecurityGroupId
  VpcLinkSecurityGroupId:
    Value: !GetAtt VpcLinkSecurityGroup.GroupId
    Export:
      Name: !Sub ${AWS::StackName}-VpcLinkSecurityGroupId
  VpcLinkId:
    Value: !Ref VpcLink
    Export:
      Name: !Sub ${AWS::StackName}-VpcLinkId
  HttpApiId:
    Value: !Ref HttpApi
    Export:
      Name: !Sub ${AWS::StackName}-HttpApiId
  DbHost:
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-DbHost
  RedisHost:
    Value: !GetAtt Redis.RedisEndpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-RedisHost
  RedisPort:
    Value: !GetAtt Redis.RedisEndpoint.Port
    Export:
      Name: !Sub ${AWS::StackName}-RedisPort
  DbSecretArn:
    Value: !Ref DbSecret
    Export:
      Name: !Sub ${AWS::StackName}-DbSecretArn
  InternalKeySecretArn:
    Value: !Ref InternalKeySecret
    Export:
      Name: !Sub ${AWS::StackName}-InternalKeySecretArn
  JwtPassphraseSecretArn:
    Value: !Ref JwtPassphraseSecret
    Export:
      Name: !Sub ${AWS::StackName}-JwtPassphraseSecretArn
  GameDatabaseUrlSecretArn:
    Value: !Ref GameDatabaseUrlSecret
    Export:
      Name: !Sub ${AWS::StackName}-GameDatabaseUrlSecretArn
  AuthRepositoryUri:
    Value: !GetAtt AuthRepository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-AuthRepositoryUri
  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-ApiRepositoryUri
  GameRepositoryUri:
    Value: !GetAtt GameRepository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-GameRepositoryUri
  LogGroupName:
    Value: !Ref LogGroup
    Export:
      Name: !Sub ${AWS::StackName}-LogGroupName
  ApiEndpoint:
    Description: Default execute-api base URL (works even without a custom domain).
    Value: !GetAtt HttpApi.ApiEndpoint
  ApiUrl:
    Description: Public base URL. Point the web app's NEXT_PUBLIC_*_URL values at it.
    Value: !If
      - HasApiDomain
      - !Sub https://${ApiDomainName}
      - !GetAtt HttpApi.ApiEndpoint
