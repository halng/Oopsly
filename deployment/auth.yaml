AWSTemplateFormatVersion: "2010-09-09"
Description: Quizi auth service on Fargate, 1 task behind an internal ALB, exposed through the shared HTTP API.

Parameters:
  Environment:
    Type: String
    Default: stg
    AllowedPattern: "[a-z0-9-]+"
  NetworkStackName:
    Type: String
    Default: quizi-network-stg
    Description: Stack created from network.yaml.
  ImageTag:
    Type: String
    Description: Tag already copied into the auth ECR repository (see scripts/copy-images.sh).
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 6
    Description: Number of Fargate tasks.
  AllowedOrigins:
    Type: String
    Default: http://localhost:3000
    Description: Comma-separated browser origins allowed to call the service.

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue: !Sub ${NetworkStackName}-DbSecretArn
                  - Fn::ImportValue: !Sub ${NetworkStackName}-InternalKeySecretArn
                  - Fn::ImportValue: !Sub ${NetworkStackName}-JwtPassphraseSecretArn

  # What the running container may do: manage profile pictures and invoke the noti Lambda.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: noti
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                # Built from the name rather than imported, so auth deploys with or
                # without the noti stack.
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:quizi-noti-${Environment}
        - PolicyName: avatars
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub
                  - "${BucketArn}/avatars/*"
                  - BucketArn:
                      Fn::ImportValue: !Sub ${NetworkStackName}-AvatarBucketArn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub quizi-auth-${Environment}
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: quizi-auth
          Image: !Sub
            - "${Repository}:${ImageTag}"
            - Repository:
                Fn::ImportValue: !Sub ${NetworkStackName}-AuthRepositoryUri
          Essential: true
          PortMappings:
            - ContainerPort: 9010
              Protocol: tcp
          Environment:
            # local, dev, develop and development are develop environments: auth sends no
            # email there and logs each skipped email's data (sign-in codes included).
            # Name real stacks stg, prod and so on.
            - Name: APP_ENV
              Value: !Ref Environment
            - Name: PORT
              Value: "9010"
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub ${NetworkStackName}-DbHost
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_NAME
              Value: quizi
            - Name: DB_USERNAME
              Value: quizi
            - Name: REDIS_HOST
              Value:
                Fn::ImportValue: !Sub ${NetworkStackName}-RedisHost
            - Name: REDIS_PORT
              Value:
                Fn::ImportValue: !Sub ${NetworkStackName}-RedisPort
            - Name: ALLOWED_ORIGINS
              Value: !Ref AllowedOrigins
            - Name: AVATAR_BUCKET
              Value:
                Fn::ImportValue: !Sub ${NetworkStackName}-AvatarBucketName
            - Name: AVATAR_REGION
              Value: !Ref AWS::Region
            - Name: NOTI_FUNCTION_NAME
              Value: !Sub quizi-noti-${Environment}
            - Name: NOTI_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${Secret}:password::"
                - Secret:
                    Fn::ImportValue: !Sub ${NetworkStackName}-DbSecretArn
            - Name: INTERNAL_API_KEY
              ValueFrom: !Sub
                - "${Secret}"
                - Secret:
                    Fn::ImportValue: !Sub ${NetworkStackName}-InternalKeySecretArn
            - Name: JWT_KEY_PASSPHRASE
              ValueFrom: !Sub
                - "${Secret}"
                - Secret:
                    Fn::ImportValue: !Sub ${NetworkStackName}-JwtPassphraseSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${NetworkStackName}-LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: auth

  # Internal: only the API Gateway VPC link and other tasks can reach it.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal load balancer for quizi-auth
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub ${NetworkStackName}-VpcLinkSecurityGroupId
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub ${NetworkStackName}-TaskSecurityGroupId

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub ${NetworkStackName}-TaskSecurityGroupId
      IpProtocol: tcp
      FromPort: 9010
      ToPort: 9010
      SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId
      Description: quizi-auth load balancer to tasks

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub quizi-auth-${Environment}
      Type: application
      Scheme: internal
      SecurityGroups:
        - !GetAtt AlbSecurityGroup.GroupId
      Subnets: !Split
        - ","
        - Fn::ImportValue: !Sub ${NetworkStackName}-SubnetIds

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub quizi-auth-${Environment}
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VpcId
      Port: 9010
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/auth/actuator/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: quizi-auth
      Cluster:
        Fn::ImportValue: !Sub ${NetworkStackName}-ClusterName
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub ${NetworkStackName}-TaskSecurityGroupId
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub ${NetworkStackName}-SubnetIds
      LoadBalancers:
        - ContainerName: quizi-auth
          ContainerPort: 9010
          TargetGroupArn: !Ref TargetGroup

  # ------------------------------------------------- API Gateway routes
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${NetworkStackName}-HttpApiId
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VpcLinkId
      IntegrationUri: !Ref HttpListener
      PayloadFormatVersion: "1.0"
      TimeoutInMillis: 30000

  PublicApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${NetworkStackName}-HttpApiId
      RouteKey: "ANY /api/auth/v1/{proxy+}"
      Target: !Sub integrations/${Integration}

  JwksRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Fn::ImportValue: !Sub ${NetworkStackName}-HttpApiId
      RouteKey: "ANY /api/auth/.well-known/{proxy+}"
      Target: !Sub integrations/${Integration}

Outputs:
  InternalUrl:
    Description: Private base URL, for other services in the VPC.
    Value: !Sub http://${LoadBalancer.DNSName}
  JwksUrl:
    Description: Internal JWKS URL, used by the api and game stacks.
    Value: !Sub http://${LoadBalancer.DNSName}/api/auth/.well-known/pub.json
    Export:
      Name: !Sub ${AWS::StackName}-JwksUrl
  AuthBaseUrl:
    Description: Internal base URL of the auth API, used by the api stack for /internal calls.
    Value: !Sub http://${LoadBalancer.DNSName}/api/auth
    Export:
      Name: !Sub ${AWS::StackName}-AuthBaseUrl
