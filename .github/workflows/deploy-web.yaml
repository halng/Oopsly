name: Deploy Frontend

on:
  workflow_call:
    inputs:
      git_hash:
        required: false
        type: string
      git_tag:
        required: false
        type: string
      env:
        required: true
        type: choice
        options:
          - stg
          - prod
    secrets:
      VERCEL_TOKEN:
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release-ref: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check deployment parameters
        id: check
        run: |
          if [[ -z "${{ inputs.git_hash }}" && -z "${{ inputs.git_tag }}" ]]; then
            echo "Error: Either git_hash or git_tag must be provided."
            exit 1
          fi

          if [[ -n "${{ inputs.git_hash }}" && -n "${{ inputs.git_tag }}" ]]; then
            echo "Error: Only one of git_hash or git_tag should be provided."
            exit 1
          fi

          if [[ -n "${{ inputs.git_hash }}" ]]; then
            echo "tag=${{ inputs.git_hash }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.git_tag }}" >> $GITHUB_OUTPUT
          fi
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ needs.validate.outputs.release-ref != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release-ref }}
      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          # If env is prod, use --prod flag
          if [ "${{ inputs.env }}" == "prod" ]; then
            vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
          else
            vercel --token ${{ secrets.VERCEL_TOKEN }}
          fi
