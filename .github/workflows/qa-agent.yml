name: Oopsly QA Agent (Copilot)

on:
  pull_request:
    types: [labeled]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  delegate-to-copilot:
    name: Delegate QA Task to Copilot
    runs-on: ubuntu-latest

    if: >
      github.event.label != null &&
      github.event.label.name == 'qa-agent'

    steps:
      - uses: actions/checkout@v4

      - name: Create QA task issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Resolving PR URL…"
          PR_URL=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json url -q .url)

          if [[ -z "$PR_URL" ]]; then
            echo "ERROR: Unable to resolve PR URL"
            exit 1
          fi

          BODY_CONTENT=$(cat <<EOF
          @copilot Please act as the **QA Automation Lead** for **Project Oopsly**.

          **Context**
          A QA review has been requested for the following Pull Request:
          $PR_URL

          **Your Responsibilities**
          1. Analyze the PR diff and identify high-risk areas.
          2. Define a test strategy covering:
             - Happy paths
             - Edge cases
             - Security concerns
          3. Implement automated tests in new test files only.
          4. Document any assumptions or ambiguities.

          **Strict Constraints**
          - Do NOT modify production code.
          - Be defensive: assume nulls, malformed input, and hostile usage.
          - Follow .github/copilot-instructions.md

          The objective is to expose defects, not fix them.
          EOF
          )

          echo "Creating issue…"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/issues" \
            -f title="🤖 QA Automation Task for PR #$PR_NUMBER" \
            -f body="$BODY_CONTENT" \
            -f labels='["qa","automation","copilot"]'


          echo "✅ QA task created successfully"
