name: Oopsly QA Agent (Copilot)

on:
  pull_request:
    types: [labeled]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  delegate-to-copilot:
    # Only run if the comment is on a PR and contains "/approve-qa"
    if: github.event.label.name == 'qa-agent'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Copilot Agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # 1. Fetch PR Details (URL is needed for the body)
          echo "Fetching details for PR #$PR_NUMBER..."
          PR_URL=$(gh pr view $PR_NUMBER --json url -q .url)

          # 2. Define the Body Text
          # We use a Here-Doc (EOF) to safely store the multi-line string in a variable
          read -r -d '' BODY_CONTENT <<EOF
          @copilot Please act as the QA Lead for **Project Oopsly**.
          
          Context:
          The user has requested a QA review for Pull Request $PR_URL.
          
          **Your Task:**
          1. Analyze the changes in the linked PR.
          2. Create a checklist of test cases (Happy Path, Edge Cases, Security).
          3. Implement these tests in a new test file.
          4. Open a PR with these changes.
          
          **Constraints:**
          - Be defensive. Assume inputs can be malicious or null.
          - Do not modify existing implementation code, only add tests.
          - Follow the instructions in ./.github/copilot-instructions.md
          EOF

          # 3. Create Safe JSON Payload using jq
          # --arg passes the bash variable into jq safely (handling newlines/quotes)
          jq -n \
            --arg body "$BODY_CONTENT" \
            --arg title "🤖 QA Task: Generate Tests for PR #$PR_NUMBER" \
            '{
              title: $title,
              body: $body,
              labels: ["testing", "automation"]
            }' > payload.json

          # 4. Send API Request
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/issues" \
            --input payload.json

