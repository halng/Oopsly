name: Oopsly QA Agent (Copilot)

on:
  pull_request:
    types: [labeled]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  delegate-to-copilot:
    name: Delegate QA Task to Copilot
    runs-on: ubuntu-latest

    # Run only when the "qa-agent" label is applied
    if: >
      github.event.label != null &&
      github.event.label.name == 'qa-agent'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh auth status

      - name: Create QA Task for Copilot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Fetching PR details for #${PR_NUMBER}..."

          PR_URL=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json url -q .url)

          if [ -z "${PR_URL}" ]; then
            echo "Failed to resolve PR URL"
            exit 1
          fi

          echo "Resolved PR URL: ${PR_URL}"

          read -r -d '' BODY_CONTENT <<'EOF'
          @copilot Please act as the **QA Automation Lead** for **Project Oopsly**.

          **Context**
          A QA review has been requested for the following Pull Request:
          PR_LINK

          **Your Responsibilities**
          1. Analyze the PR diff and identify risk areas.
          2. Produce a structured test strategy covering:
             - Happy paths
             - Edge cases
             - Security and validation failures
          3. Implement the required automated tests in *new* test files only.
          4. Clearly document any assumptions or ambiguities.

          **Strict Constraints**
          - Do NOT modify existing production code.
          - Be defensive: assume nulls, malformed input, and hostile usage.
          - Follow all rules defined in `.github/copilot-instructions.md`.

          The goal is to expose weaknesses, not to fix them.
          EOF

          BODY_CONTENT="${BODY_CONTENT/PR_LINK/${PR_URL}}"

          jq -n \
            --arg title "🤖 QA Automation Task for PR #${PR_NUMBER}" \
            --arg body "${BODY_CONTENT}" \
            '{
              title: $title,
              body: $body,
              labels: ["qa", "automation", "copilot"]
            }' > payload.json

          echo "Creating QA task issue..."

          gh api \
            --method POST \
            --repo "${REPO}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/issues" \
            --input payload.json

          echo "QA task successfully created."
