name: Oopsly QA Agent (Copilot)

on:
  pull_request:
    types: [labeled]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  delegate-to-copilot:
    # Only run if the comment is on a PR and contains "/approve-qa"
    if: github.event.label.name == 'qa-agent'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Copilot Agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          export BODY="@copilot Please act as the QA Lead for **Project Oopsly**.
          
          Context:
          The user has requested a QA review for Pull Request $PR_URL.
          
          **Your Task:**
          1. Analyze the changes in the linked PR.
          2. Create a checklist of test cases (Happy Path, Edge Cases, Security).
          3. Implement these tests in a new test file (using our project's testing framework).
          4. Open a PR with these changes.
          
          **Constraints:**
          - Be defensive. Assume inputs can be malicious or null.
          - Do not modify existing implementation code, only add tests.
          - Check for existing tests to avoid duplication.
          - Prioritize high-impact tests if time is limited.
          - Follow the project's coding standards and best practices.
          - Follow the instructions in ./.github/copilot-instructions.md"
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/halng/Oopsly/issues \
            --input - <<< '{
            "title": "🤖 QA Task: Generate Tests for PR #$PR_NUMBER",
            "body": "$BODY",
            "labels": [
              "testing",
              "automation"
            ]
          }'

