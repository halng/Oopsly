name: Performance Test

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to test (defaults to the triggering release)
        required: false
        type: string
      test_profile:
        description: k6 profile
        required: true
        type: choice
        options:
          - smoke
          - flaky
          - stress
          - spike

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: oopsly-perf-${{ github.run_id }}
      TEST_PROFILE: ${{ inputs.test_profile || 'smoke' }}
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Validate input and GCP settings
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          case "$TEST_PROFILE" in
            smoke|flaky|stress|spike) ;;
            *) echo "Unsupported test_profile '$TEST_PROFILE'"; exit 1 ;;
          esac
          [ -n "${GCP_PROJECT_ID}" ] || { echo "Missing GCP_PROJECT_ID variable"; exit 1; }
          [ -n "${GCP_REGION}" ] || { echo "Missing GCP_REGION variable"; exit 1; }
          [ -n "${GCP_SERVICE_ACCOUNT_KEY}" ] || { echo "Missing GCP_SERVICE_ACCOUNT_KEY secret"; exit 1; }
          [ -n "${RELEASE_TAG}" ] || { echo "A release tag is required"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API for perf run
        env:
          PERF_DB_HOST: ${{ secrets.PERF_DB_HOST }}
          PERF_DB_PORT: ${{ secrets.PERF_DB_PORT }}
          PERF_DB_NAME: ${{ secrets.PERF_DB_NAME }}
          PERF_DB_USERNAME: ${{ secrets.PERF_DB_USERNAME }}
          PERF_DB_PASSWORD: ${{ secrets.PERF_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in PERF_DB_HOST PERF_DB_NAME PERF_DB_USERNAME PERF_DB_PASSWORD; do
            [ -n "${!variable}" ] || { echo "Missing ${variable} secret"; exit 1; }
          done
          PERF_DB_PORT="${PERF_DB_PORT:-5432}"
          gcloud run deploy "$SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source ./api \
            --allow-unauthenticated \
            --set-env-vars "SPRING_PROFILES_ACTIVE=perf,DB_HOST=${PERF_DB_HOST},DB_PORT=${PERF_DB_PORT},DB_NAME=${PERF_DB_NAME},DB_USERNAME=${PERF_DB_USERNAME},DB_PASSWORD=${PERF_DB_PASSWORD}" \
            --quiet

      - name: Resolve deployed URL
        id: resolve_url
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "base_url=${SERVICE_URL}/api/v1/oopsly" >> "$GITHUB_OUTPUT"

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 profile
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          PERF_FIREBASE_REFRESH_TOKEN: ${{ secrets.PERF_FIREBASE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$FIREBASE_API_KEY" ] || { echo "Missing FIREBASE_API_KEY secret"; exit 1; }
          [ -n "$PERF_FIREBASE_REFRESH_TOKEN" ] || { echo "Missing PERF_FIREBASE_REFRESH_TOKEN secret"; exit 1; }
          TOKEN_RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST "https://securetoken.googleapis.com/v1/token?key=${FIREBASE_API_KEY}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=${PERF_FIREBASE_REFRESH_TOKEN}")
          PERF_AUTH_TOKEN=$(jq -er '.id_token' <<<"$TOKEN_RESPONSE")
          mkdir -p /tmp/perf-reports
          k6 run \
            -e BASE_URL="${{ steps.resolve_url.outputs.base_url }}" \
            -e TEST_PROFILE="$TEST_PROFILE" \
            -e AUTH_TOKEN="$PERF_AUTH_TOKEN" \
            --summary-export /tmp/perf-reports/summary.json \
            api/src/test/java/com/app/oopsly/api/perf/backend.js

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ inputs.test_profile }}
          path: /tmp/perf-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup Cloud Run service
        if: always()
        run: |
          gcloud run services delete "$SERVICE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --quiet || true
