name: Release

# Manual release of one backend service (auth, api, game or the noti email Lambda), or all
# of them. Give it the tag the Docker images were built with (the "Build and Push Docker
# Image" workflow) and the service to deploy. It validates the input, deploys through
# deploy-aws.yaml, then creates a GitHub release tagged <tag>.<service> (<tag>.all when every
# service is deployed): a release for prod, a pre-release for stg. Shared infrastructure
# (network, Postgres, Redis, API Gateway) is provisioned by the deployment itself.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag used to build the Docker images, for example v1a2b3c4"
        required: true
        type: string
      service:
        description: "Service to deploy (all = auth, api, game and noti)"
        required: true
        type: choice
        options:
          - all
          - auth
          - api
          - game
          - noti
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - stg
          - prod
        default: stg

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate ${{ inputs.tag }} (${{ inputs.service }})
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.check.outputs.services }}
      release-tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the tag and the images
        id: check
        env:
          TAG: ${{ inputs.tag }}
          SERVICE: ${{ inputs.service }}
        run: |
          if [[ ! "$TAG" =~ ^v[A-Za-z0-9._-]+$ ]]; then
            echo "Error: tag must look like v1a2b3c4."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Error: tag ${TAG} does not exist. Run 'Build and Push Docker Image' first."
            exit 1
          fi

          if [[ "$SERVICE" == "all" ]]; then
            SERVICES="auth api game noti"
            RELEASE_TAG="${TAG}.all"
          else
            SERVICES="$SERVICE"
            RELEASE_TAG="${TAG}.${SERVICE}"
          fi

          # Fail now, not halfway through a deployment, if an image was never pushed.
          # noti is a Lambda built from the tagged source, so it has no image.
          for service in $SERVICES; do
            if [[ "$service" == "noti" ]]; then continue; fi
            image="ghcr.io/halng/oopsly-${service}:${TAG}"
            if ! docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Error: ${image} was not found. Build it with the same tag first."
              exit 1
            fi
          done

          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "## Release ${RELEASE_TAG} to ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Approve ${{ inputs.environment }} deployment
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}_approval
    steps:
      - run: echo "Approved ${{ inputs.service }} ${{ inputs.tag }} for ${{ inputs.environment }}"

  deploy:
    name: Deploy ${{ inputs.service }} to ${{ inputs.environment }} environment
    needs: approve
    uses: ./.github/workflows/deploy-aws.yaml
    with:
      git_tag: ${{ inputs.tag }}
      env: ${{ inputs.environment }}
      services: ${{ needs.validate-inputs.outputs.services }}
    permissions:
      contents: read
      packages: read
    secrets: inherit

  create-release:
    name: Create release ${{ needs.validate-inputs.outputs.release-tag }}
    needs: [validate-inputs, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create the GitHub release, or update it if the service was redeployed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SERVICE: ${{ inputs.service }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release-tag }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [[ "$TARGET_ENV" == "prod" ]]; then
            KIND="--prerelease=false"
          else
            KIND="--prerelease"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; updating it for ${TARGET_ENV}."
            gh release edit "$RELEASE_TAG" "$KIND"
          else
            # The release tag is created on the commit the images were built from.
            gh release create "$RELEASE_TAG" "$KIND" \
              --target "$(git rev-list -n 1 "refs/tags/${TAG}")" \
              --title "${SERVICE} ${TAG}" --generate-notes
          fi
