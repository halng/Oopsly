name: BE - CI

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21
      - name: gradle caching
        uses: gradle/actions/setup-gradle@v5
      - name: Spotless Check
        with:
          working-directory: api
        run: ./gradlew spotlessCheck