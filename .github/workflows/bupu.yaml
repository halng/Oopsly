name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      gitSHA:
        description: "The git SHA to deploy"
        required: true
        type: string
      authService:
        description: "Check if need to build for auth module"
        required: true
        type: boolean
      apiService:
        description: "Check if need to build for API module"
        required: true
        type: boolean
      gameService:
        description: "Check if need to build for game module"
        required: true
        type: boolean

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check deployment parameters
        id: check
        run: |
          if [[ -z "${{ inputs.gitSHA }}" ]]; then
            echo "Error: git SHA must be provided."
            exit 1
          fi
          if [[ "${{ inputs.authService }}" != 'true' && "${{ inputs.apiService }}" != 'true' && "${{ inputs.gameService }}" != 'true' ]]; then
            echo "Error: At least one service must be selected for build."
            exit 1
          fi

          TAG_NAME="v${GITHUB_SHA::7}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
  

  auth-service:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.authService == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitSHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Java env
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/auth/pyproject.toml
      - name: Build Docker Image
        run: docker build -t ghcr.io/halng/oopsly-auth:${{ needs.validate-inputs.outputs.tag-name }} .
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/auth

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/halng/oopsly-auth:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/auth
    
  api-service:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.apiService == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitSHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Java env
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build Native Docker Image
        run: ./gradlew bootBuildImage --imageName=ghcr.io/halng/oopsly-api:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/api

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/halng/oopsly-api:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/api

  game-service:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.gameService == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitSHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/game/pyproject.toml
      - name: build docker image
        run: docker build -t ghcr.io/halng/oopsly-game:${{ needs.validate-inputs.outputs.tag-name }} .
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PORT: 9008
        working-directory: app/game

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/halng/oopsly-game:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/game
