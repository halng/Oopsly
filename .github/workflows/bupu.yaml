name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      gitSHA:
        description: "The git SHA to deploy"
        required: true
        type: string
      authService:
        description: "Check if need to build for auth module"
        required: true
        type: boolean
      apiService:
        description: "Check if need to build for API module"
        required: true
        type: boolean
      gameService:
        description: "Check if need to build for game module"
        required: true
        type: boolean

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check deployment parameters
        id: check
        env:
          GIT_SHA: ${{ inputs.gitSHA }}
          AUTH: ${{ inputs.authService }}
          API: ${{ inputs.apiService }}
          GAME: ${{ inputs.gameService }}
        run: |
          if [[ -z "$GIT_SHA" ]]; then
            echo "Error: git SHA must be provided."
            exit 1
          fi
          if [[ "$AUTH" != 'true' && "$API" != 'true' && "$GAME" != 'true' ]]; then
            echo "Error: At least one service must be selected for build."
            exit 1
          fi

          # Derive the tag from the requested commit, not the commit the
          # workflow itself was dispatched on (GITHUB_SHA).
          TAG_NAME="v${GIT_SHA::7}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

  auth-service:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.authService == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitSHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/auth/pyproject.toml
      - name: Build Docker Image
        run: docker build -t ghcr.io/halng/oopsly-auth:${{ needs.validate-inputs.outputs.tag-name }} .
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/auth

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/halng/oopsly-auth:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/auth
    
  api-service:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.apiService == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitSHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        run: docker build -t ghcr.io/halng/oopsly-api:${{ needs.validate-inputs.outputs.tag-name }} .
        working-directory: app/api

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/halng/oopsly-api:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/api

  game-service:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.gameService == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitSHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/game/pyproject.toml
      - name: build docker image
        run: docker build -t ghcr.io/halng/oopsly-game:${{ needs.validate-inputs.outputs.tag-name }} .
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PORT: 9008
        working-directory: app/game

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/halng/oopsly-game:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/game

  create-tag:
    runs-on: ubuntu-latest
    needs:
      - validate-inputs
      - api-service
      - game-service
      - auth-service

    # Run after all dependencies finish, but only tag if every
    # selected service succeeded and validation passed.
    if: >-
      always() &&
      needs.validate-inputs.result == 'success' &&
      (
        inputs.apiService != true ||
        needs.api-service.result == 'success'
      ) &&
      (
        inputs.gameService != true ||
        needs.game-service.result == 'success'
      ) &&
      (
        inputs.authService != true ||
        needs.auth-service.result == 'success'
      ) &&
      (
        inputs.apiService == true ||
        inputs.gameService == true ||
        inputs.authService == true
      )

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout target commit and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitSHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image descriptions
        id: images
        shell: bash
        env:
          TAG_NAME: ${{ needs.validate-inputs.outputs.tag-name }}
          BUILD_AUTH: ${{ inputs.authService }}
          BUILD_API: ${{ inputs.apiService }}
          BUILD_GAME: ${{ inputs.gameService }}
        run: |
          set -euo pipefail

          # Reads org.opencontainers.image.description from each image that
          # was built and pushed in this run.
          : > IMAGES.md
          for entry in "auth:$BUILD_AUTH" "api:$BUILD_API" "game:$BUILD_GAME"; do
            name="${entry%%:*}"
            [[ "${entry#*:}" == "true" ]] || continue

            image="ghcr.io/halng/oopsly-${name}:${TAG_NAME}"
            docker pull --quiet "$image" >/dev/null

            description=$(
              docker image inspect "$image" \
                --format '{{ index .Config.Labels "org.opencontainers.image.description" }}'
            )
            if [[ -z "$description" || "$description" == "<no value>" ]]; then
              echo "::warning::$image has no org.opencontainers.image.description label"
              description="(no description)"
            fi

            echo "- \`$image\` - $description" >> IMAGES.md
          done

          cat IMAGES.md

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.gitSHA }}
        run: |
          set -euo pipefail

          git config --global user.email "haonguyentan2001@gmail.com"
          git config --global user.name "halng"

          git fetch origin --tags

          # Find the closest reachable tag before the target commit.
          PREVIOUS_TAG=$(
            git describe --tags --abbrev=0 "${TARGET_SHA}^" 2>/dev/null || true
          )

          if [[ -n "$PREVIOUS_TAG" ]]; then
            echo "Previous release: $PREVIOUS_TAG"
            RANGE="${PREVIOUS_TAG}..${TARGET_SHA}"
          else
            echo "No previous tag found; including available history."
            RANGE="$TARGET_SHA"
          fi

          {
            echo "# Changelog"
            echo
            echo "- Target commit: \`$TARGET_SHA\`"

            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "- Previous release: \`$PREVIOUS_TAG\`"
            fi

            echo
            echo "## Images"
            echo
            cat IMAGES.md
            echo
            echo "## Changes"
            echo

            git log "$RANGE" \
              --pretty=format:'- %s (%h)' \
              --no-merges

            echo
          } > CHANGELOG.md

          cat CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push annotated tag
        shell: bash
        env:
          TAG_NAME: ${{ needs.validate-inputs.outputs.tag-name }}
          TARGET_SHA: ${{ inputs.gitSHA }}
        run: |
          set -euo pipefail

          git cat-file -e "${TARGET_SHA}^{commit}"

          if git ls-remote --exit-code --tags origin \
            "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME"
            exit 1
          fi

          IMAGES=$(cat IMAGES.md)

          git tag -a "$TAG_NAME" "$TARGET_SHA" \
            -m "Release $TAG_NAME" \
            -m "Commit: $TARGET_SHA" \
            -m "Images:"$'\n'"$IMAGES"

          git push origin "refs/tags/$TAG_NAME"

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ needs.validate-inputs.outputs.tag-name }}
          path: CHANGELOG.md
          if-no-files-found: error