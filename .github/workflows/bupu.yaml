name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      gitSHA:
        description: "The git SHA to deploy"
        required: true
        type: string
      authService:
        description: "Check if need to build for auth module"
        required: true
        type: boolean
      apiService:
        description: "Check if need to build for API module"
        required: true
        type: boolean
      gameService:
        description: "Check if need to build for game module"
        required: true
        type: boolean

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      tag-name: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check deployment parameters
        id: check
        run: |
          if [[ -z "${{ inputs.gitSHA }}" ]]; then
            echo "Error: git SHA must be provided."
            exit 1
          fi
          if [[ "${{ inputs.authService }}" != 'true' && "${{ inputs.apiService }}" != 'true' && "${{ inputs.gameService }}" != 'true' ]]; then
            echo "Error: At least one service must be selected for build."
            exit 1
          fi

          TAG_NAME="v${GITHUB_SHA::7}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
  

  auth-service:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.authService == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitSHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/auth/pyproject.toml
      - name: Build Docker Image
        run: docker build -t ghcr.io/halng/oopsly-auth:${{ needs.validate-inputs.outputs.tag-name }} .
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/auth

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/halng/oopsly-auth:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/auth
    
  api-service:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.apiService == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitSHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Java env
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build Native Docker Image
        run: ./gradlew bootBuildImage --imageName=ghcr.io/halng/oopsly-api:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/api

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/halng/oopsly-api:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/api

  game-service:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.gameService == true }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.gitSHA }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/game/pyproject.toml
      - name: build docker image
        run: docker build -t ghcr.io/halng/oopsly-game:${{ needs.validate-inputs.outputs.tag-name }} .
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PORT: 9008
        working-directory: app/game

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/halng/oopsly-game:${{ needs.validate-inputs.outputs.tag-name }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        working-directory: app/game

  create-tag:
    runs-on: ubuntu-latest
    needs:
      - validate-inputs
      - api-service
      - game-service
      - auth-service

    # Run after all dependencies finish, but only tag if every
    # selected service succeeded and validation passed.
    if: >-
      always() &&
      needs.validate-inputs.result == 'success' &&
      (
        inputs.apiService != true ||
        needs.api-service.result == 'success'
      ) &&
      (
        inputs.gameService != true ||
        needs.game-service.result == 'success'
      ) &&
      (
        inputs.authService != true ||
        needs.auth-service.result == 'success'
      ) &&
      (
        inputs.apiService == true ||
        inputs.gameService == true ||
        inputs.authService == true
      )

    permissions:
      contents: write

    steps:
      - name: Checkout target commit and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gitSHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Generate changelog
        id: changelog
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.gitSHA }}
        run: |
          set -euo pipefail

          git fetch origin --tags

          # Find the closest reachable tag before the target commit.
          PREVIOUS_TAG=$(
            git describe --tags --abbrev=0 "${TARGET_SHA}^" 2>/dev/null || true
          )

          if [[ -n "$PREVIOUS_TAG" ]]; then
            echo "Previous release: $PREVIOUS_TAG"
            RANGE="${PREVIOUS_TAG}..${TARGET_SHA}"
          else
            echo "No previous tag found; including available history."
            RANGE="$TARGET_SHA"
          fi

          {
            echo "# Changelog"
            echo
            echo "- Target commit: \`$TARGET_SHA\`"

            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "- Previous release: \`$PREVIOUS_TAG\`"
            fi

            echo
            echo "## Changes"
            echo

            git log "$RANGE" \
              --pretty=format:'- %s (%h)' \
              --no-merges

            echo
          } > CHANGELOG.md

          cat CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push annotated tag
        shell: bash
        env:
          TAG_NAME: ${{ needs.validate-inputs.outputs.tag-name }}
          TARGET_SHA: ${{ inputs.gitSHA }}
        run: |
          set -euo pipefail

          git cat-file -e "${TARGET_SHA}^{commit}"

          if git ls-remote --exit-code --tags origin \
            "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG_NAME"
            exit 1
          fi

          git tag -a "$TAG_NAME" "$TARGET_SHA" \
            -m "Release $TAG_NAME" \
            -m "Commit: $TARGET_SHA"

          git push origin "refs/tags/$TAG_NAME"

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ needs.validate-inputs.outputs.tag-name }}
          path: CHANGELOG.md
          if-no-files-found: error