name: CD

on:
  push:
    branches:
      - main
      - release/**

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write
  packages: write

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make cd.sh executable
        run: chmod +x .github/workflows/cd.sh

      - name: Run CD Script
        run: ./.github/workflows/cd.sh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: halng
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name  }}
          REF: ${{ github.ref }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
