name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      git_hash:
        required: false
        type: string
      env:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release-ref: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check deployment parameters
        id: check
        run: |
          if [[ -z "${{ inputs.git_hash }}" ]]; then
            echo "Error: git_hash must be provided."
            exit 1
          fi

          echo "tag=${{ inputs.git_hash }}" >> $GITHUB_OUTPUT
  deploy:
    environment:
      name: ${{ inputs.env }}_approval
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ needs.validate.outputs.release-ref != '' && needs.validate.outputs.release-ref != 'null' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release-ref }}
      - name: Deploy to Vercel to ${{ inputs.env }}
        run: |
          npm install -g vercel
          # If env is prod, use --prod flag
          if [ "${{ inputs.env }}" == "prod" ]; then
            vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
          else
            vercel --yes --token ${{ secrets.VERCEL_TOKEN }}
          fi
        working-directory: ./app/web