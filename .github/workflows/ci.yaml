name: CI

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
  schedule:
    - cron: '0 2 * * 0' # weekly Sunday 02:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make ci.sh executable
        run: chmod +x .github/workflows/ci.sh

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('ui/pnpm-lock.yaml') }}

      - name: Run CI Script
        run: ./.github/workflows/ci.sh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: halng
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name  }}
          REF: ${{ github.ref }}
          # Do NOT set CYPRESS_COVERAGE / BABEL_ENV here — they enable
          # babel-plugin-istanbul and break the Jest coverage gate.
          # ci.sh exports them only around the Cypress e2e step.

      - name: Upload UI coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: |
            ui/coverage/
            ui/coverage-cypress/
            ui/coverage-combined/
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: ui/cypress/screenshots/
          if-no-files-found: ignore
