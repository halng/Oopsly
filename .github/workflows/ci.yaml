name: CI

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
  schedule:
    - cron: '0 2 * * 0' # weekly Sunday 02:00 UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write
  packages: write

jobs:
  # Backend + UI lint/Jest (no Cypress — keeps Istanbul env off the Jest gate).
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make ci.sh executable
        run: chmod +x .github/workflows/ci.sh

      - name: Run CI Script
        run: ./.github/workflows/ci.sh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: halng
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-jest-coverage
          path: ui/coverage/
          if-no-files-found: ignore

  # Headless Cypress e2e against Expo web (electron).
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cypress e2e (headless electron)
        uses: cypress-io/github-action@v6
        with:
          working-directory: ui
          install-command: pnpm install --frozen-lockfile
          # Start instrumented Expo web; action waits then runs Cypress headless.
          start: pnpm web:coverage
          wait-on: http://127.0.0.1:8081
          wait-on-timeout: 180
          browser: electron
          headed: false
          command: pnpm e2e:cypress:run
        env:
          CI: true
          CYPRESS_COVERAGE: "true"
          BABEL_ENV: cypress
          TS_NODE_PROJECT: ./cypress/tsconfig.json
          EXPO_NO_TELEMETRY: 1

      - name: Check e2e coverage gates
        working-directory: ui
        run: pnpm coverage:check:e2e

      - name: Upload Cypress coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-cypress-coverage
          path: |
            ui/coverage-cypress/
            ui/.nyc_output/
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: ui/cypress/screenshots/
          if-no-files-found: ignore
