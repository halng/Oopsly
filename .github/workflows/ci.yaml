name: CI

on:
  push:
    branches:
      - main
      - release/**
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches:
      - main
      - release/**
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  api:
    name: CI API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Sonar scanner
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-api
          restore-keys: |
            ${{ runner.os }}-sonar-api
            ${{ runner.os }}-sonar-

      # Compile + format gate first (fail fast; no clean — cache-friendly).
      - name: Spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: Compile
        run: ./gradlew classes testClasses --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon
      - name: Integration tests
        run: ./gradlew integrationTest --rerun --no-daemon

      - name: Jacoco coverage verification
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_API }}
        run: ./gradlew sonar --no-daemon

      - name: Upload Jacoco / test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-jacoco-report
          path: |
            app/api/build/reports/jacoco/
            app/api/build/reports/tests/
            app/api/build/reports/jacocoHtml/
          if-no-files-found: warn
          retention-days: 7

  ui:
    name: CI WEB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by SonarQube for accurate blame information

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier check
        run: pnpm run format:check

      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Run Unit Tests with Coverage
        run: pnpm run test:coverage
      
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
    
      - name: Run E2E tests (Playwright)
        run: pnpm exec playwright test
      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-jest-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided automatically by GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_WEB }}
        with:
          projectBaseDir: app/web
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info