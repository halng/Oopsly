name: Deploy Service

on:
  workflow_call:
    inputs:
      git_hash:
        required: false
        description: The git hash to deploy. The workflow will be cancelled if the git hash is not provided.
        type: string
      git_tag:
        required: false
        description: The git tag to deploy. The workflow will be cancelled if the git tag is not provided.
        type: string
      env:
        required: true
        type: choice
        description: The environment to deploy to.
        default: "stg"
        options:
          - stg
          - prod
    secrets:
      RAILWAY_TOKEN:
        required: true

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      release-ref: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check deployment parameters
        id: check
        run: |
          if [[ -z "${{ inputs.git_hash }}" && -z "${{ inputs.git_tag }}" ]]; then
            echo "Error: Either git_hash or git_tag must be provided."
            exit 1
          fi

          if [[ -n "${{ inputs.git_hash }}" && -n "${{ inputs.git_tag }}" ]]; then
            echo "Error: Only one of git_hash or git_tag should be provided."
            exit 1
          fi

          if [[ -n "${{ inputs.git_hash }}" ]]; then
            echo "tag=${{ inputs.git_hash }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.git_tag }}" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ needs.validate-inputs.outputs.release-ref != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-inputs.outputs.release-ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Java env
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Native Docker Image
        run: ./gradlew bootBuildImage --imageName=ghcr.io/${{ github.repository }}/oopsly-api:${{ needs.validate-inputs.outputs.release-ref }}
        with:
          working-directory: app/api

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/${{ github.repository }}/oopsly-api:${{ needs.validate-inputs.outputs.release-ref }}
        with:
          working-directory: app/api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up --environment ${{ inputs.env }} --image ghcr.io/${{ github.repository }}/oopsly-api:${{ needs.validate-inputs.outputs.release-ref }} --tag ${{ needs.validate-inputs.outputs.release-ref }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
