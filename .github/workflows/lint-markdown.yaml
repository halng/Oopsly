name: Lint Markdown

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v21
        with:
          globs: '**/*.md'