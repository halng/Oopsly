name: CI Auth

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - "app/auth/**"
      - ".github/workflows/ci-auth.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "app/auth/**"
      - ".github/workflows/ci-auth.yaml"
  workflow_dispatch:

concurrency:
  group: ci-auth-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-auth:
    name: CI Auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by SonarQube for accurate blame information

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # Writes coverage.out (read by Sonar) and fails below COVERAGE_MIN (default 95).
      - name: Test with coverage
        run: ./scripts/coverage.sh

      - name: Build
        run: go build -o bin/auth ./cmd/auth

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_AUTH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: app/auth
