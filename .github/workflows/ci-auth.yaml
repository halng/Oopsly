name: CI Auth

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - "app/auth/**"
      - ".github/workflows/ci-auth.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "app/auth/**"
      - ".github/workflows/ci-auth.yaml"
  workflow_dispatch:

concurrency:
  group: ci-auth-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-auth:
    name: CI Auth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/auth
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build -o bin/auth ./cmd/auth
