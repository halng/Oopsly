name: CI Game

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - "app/game/**"
      - ".github/workflows/ci-game.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "app/game/**"
      - ".github/workflows/ci-game.yaml"
  workflow_dispatch:

concurrency:
  group: ci-game-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-game:
    name: CI Game
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/game/pyproject.toml

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: python -m pytest -q
