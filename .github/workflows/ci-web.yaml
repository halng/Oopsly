name: CI WEB

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - "app/web/**"
      - ".github/workflows/ci-web.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "app/web/**"
      - ".github/workflows/ci-web.yaml"

  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ci-web:
    name: CI WEB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by SonarQube for accurate blame information

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier check
        run: pnpm run format:check

      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Run Unit Tests with Coverage
        run: pnpm run test:coverage
      
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
    
      - name: Run E2E tests (Playwright)
        run: pnpm exec playwright test
      - name: Upload Testing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/web/test-results/
            app/web/coverage/
            app/web/playwright-report/
          retention-days: 3

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided automatically by GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_WEB }}
        with:
          projectBaseDir: app/web
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info