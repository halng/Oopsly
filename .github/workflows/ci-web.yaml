name: CI WEB

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - "app/web/**"
      - ".github/workflows/ci-web.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "app/web/**"
      - ".github/workflows/ci-web.yaml"

  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ci-web:
    name: CI WEB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required by SonarQube for accurate blame information

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier check
        run: pnpm run format:check

      - name: Run TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Run Unit Tests with Coverage
        run: pnpm run test:coverage

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Starts WireMock through docker compose (global setup) and stops it after.
      - name: Run integration tests (Playwright + WireMock)
        run: pnpm run test:integration
        env:
          COVERAGE: '1' # writes coverage-integration/lcov.info for Sonar

      # Unit + integration lines merged must reach 90% (scripts/check-coverage.mjs).
      - name: Enforce 90% combined coverage
        run: pnpm run coverage:check -- --top 10

      - name: Upload Testing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/web/test-results/
            app/web/coverage/
            app/web/coverage-integration/
            app/web/playwright-report/
            app/web/playwright-report-integration/
          retention-days: 3

      # Also runs when a test step failed, so Sonar still gets the coverage files.
      - name: Run SonarCloud Scan
        if: ${{ !cancelled() }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided automatically by GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_WEB }}
        with:
          # Coverage report paths (unit + integration) live in app/web/sonar-project.properties.
          projectBaseDir: app/web