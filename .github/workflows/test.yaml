name: Test - CI

on:
  push:
    branches:
      - main
    paths:
      - 'test/**'
  pull_request:
    paths:
      - 'test/**'

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test/config/requirement.txt
      - name: Run style check
        run: |
          black --check test/