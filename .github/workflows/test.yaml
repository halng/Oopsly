name: Test - CI

on:
  push:
    branches:
      - main
    paths:
      - 'test/**'
  pull_request:
    branches:
      - main
    paths:
      - 'test/**'

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test/config/requirement.txt
      - name: Run style check
        run: |
          black --check test/
  
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test/config/requirement.txt
      - name: Install Playwright browsers
        run: |
          playwright install --with-deps
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install UI dependencies
        working-directory: ui
        run: |
          npm ci
      - name: Build UI application
        working-directory: ui
        run: |
          npm run build
      - name: Start UI application
        working-directory: ui
        run: |
          npm start &
      - name: Wait for UI to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8081/ > /dev/null; then
              echo "UI is up!"
              break
            fi
            echo "Waiting for UI to be ready..."
            sleep 2
          done
      - name: Run E2E tests
        run: |
          pytest test/
      