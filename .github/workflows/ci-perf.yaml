name: CI Perf (smoke)

# Smoke performance test: boots the real API with Postgres and Redis and sends every
# endpoint a few requests with Locust. The deeper regression run lives in app/api
# (./gradlew perfRegressionTest) and uses Testcontainers.

on:
  push:
    branches:
      - main
    paths:
      - "app/perf/**"
      - "app/api/**"
      - ".github/workflows/ci-perf.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "app/perf/**"
      - "app/api/**"
      - ".github/workflows/ci-perf.yaml"
  workflow_dispatch:

concurrency:
  group: ci-perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-smoke:
    name: Locust smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oopsly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oopsly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PERF_HOST: http://localhost:9009/api/oopsly
      PERF_PROFILE: smoke
      PERF_RESULTS_DIR: results
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/perf/requirements-dev.txt

      - name: Install Locust
        working-directory: app/perf
        run: pip install -r requirements-dev.txt

      - name: Perf module unit tests
        working-directory: app/perf
        run: python -m pytest -q tests

      - name: Build API
        working-directory: app/api
        run: ./gradlew bootJar -x test --no-daemon

      - name: Start API
        working-directory: app/api
        env:
          DB_HOST: localhost
          ALLOWED_ORIGINS: http://localhost:3000
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain)
          nohup java -jar "$JAR" > ../perf/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:9009/api/oopsly/actuator/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 3
          done
          echo "API did not start"; tail -n 100 ../perf/api.log; exit 1

      - name: Locust smoke test
        working-directory: app/perf
        run: |
          locust -f locustfile.py --headless -u 2 -r 2 -t 45s \
            --csv results/smoke --only-summary

      - name: Publish perf summary
        if: always()
        working-directory: app/perf
        run: |
          echo "## Smoke performance test" >> "$GITHUB_STEP_SUMMARY"
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-results
          path: |
            app/perf/results/
            app/perf/api.log
          if-no-files-found: warn
          retention-days: 3
