<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1F2937">
    Authentication Persistence UI Flow
  </text>
  
  <!-- Loading Screen -->
  <g transform="translate(50, 80)">
    <rect width="200" height="300" rx="20" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
    <text x="100" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">
      Loading Screen
    </text>
    <circle cx="100" cy="130" r="30" fill="none" stroke="#5B5BFD" stroke-width="4" stroke-dasharray="94 31"/>
    <text x="100" y="190" font-size="12" text-anchor="middle" fill="#6B7280">
      Loading...
    </text>
    <text x="100" y="250" font-size="10" text-anchor="middle" fill="#9CA3AF">
      Checking credentials
    </text>
  </g>
  
  <!-- Success Path: Home Dashboard -->
  <g transform="translate(300, 80)">
    <rect width="200" height="300" rx="20" fill="#F9FAFB" stroke="#10B981" stroke-width="2"/>
    <text x="100" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#059669">
      Home Dashboard
    </text>
    <rect x="20" y="50" width="160" height="30" rx="5" fill="#5B5BFD"/>
    <text x="100" y="70" font-size="12" text-anchor="middle" fill="white">
      Welcome back!
    </text>
    <rect x="20" y="100" width="70" height="60" rx="5" fill="#E0E7FF" stroke="#5B5BFD"/>
    <text x="55" y="125" font-size="10" text-anchor="middle" fill="#5B5BFD">Shelf 1</text>
    <text x="55" y="145" font-size="9" text-anchor="middle" fill="#6B7280">5 cards</text>
    <rect x="110" y="100" width="70" height="60" rx="5" fill="#E0E7FF" stroke="#5B5BFD"/>
    <text x="145" y="125" font-size="10" text-anchor="middle" fill="#5B5BFD">Shelf 2</text>
    <text x="145" y="145" font-size="9" text-anchor="middle" fill="#6B7280">8 cards</text>
    <text x="100" y="190" font-size="10" text-anchor="middle" fill="#4B5563">Recent Activity</text>
    <text x="100" y="210" font-size="8" text-anchor="middle" fill="#6B7280">• Studied Math - 2h ago</text>
    <text x="100" y="225" font-size="8" text-anchor="middle" fill="#6B7280">• Created card - 5h ago</text>
  </g>
  
  <!-- Failure Path: Onboarding -->
  <g transform="translate(550, 80)">
    <rect width="200" height="300" rx="20" fill="#F9FAFB" stroke="#EF4444" stroke-width="2"/>
    <text x="100" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#DC2626">
      Onboarding
    </text>
    <rect x="30" y="60" width="140" height="80" rx="5" fill="#E0E7FF"/>
    <text x="100" y="95" font-size="11" text-anchor="middle" fill="#5B5BFD">📚</text>
    <text x="100" y="115" font-size="10" text-anchor="middle" fill="#5B5BFD">Welcome Image</text>
    <text x="100" y="170" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F2937">
      Welcome to Oopsly
    </text>
    <text x="100" y="190" font-size="8" text-anchor="middle" fill="#6B7280">
      The smart way to study
    </text>
    <text x="100" y="205" font-size="8" text-anchor="middle" fill="#6B7280">
      and retain information
    </text>
    <circle cx="85" cy="230" r="3" fill="#5B5BFD"/>
    <circle cx="100" cy="230" r="3" fill="#D1D5DB"/>
    <circle cx="115" cy="230" r="3" fill="#D1D5DB"/>
  </g>
  
  <!-- Email Input Screen -->
  <g transform="translate(800, 80)">
    <rect width="200" height="300" rx="20" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
    <text x="100" y="30" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">
      Email Input
    </text>
    <text x="20" y="60" font-size="12" font-weight="bold" fill="#1F2937">
      What's your email?
    </text>
    <text x="20" y="80" font-size="8" fill="#6B7280">
      We'll send you a secure code
    </text>
    <rect x="20" y="100" width="160" height="35" rx="8" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="30" y="122" font-size="10" fill="#9CA3AF">
      name@example.com
    </text>
    <rect x="20" y="250" width="160" height="35" rx="8" fill="#5B5BFD"/>
    <text x="100" y="272" font-size="12" text-anchor="middle" fill="white">
      Continue
    </text>
  </g>
  
  <!-- Flow Arrows -->
  <!-- Loading to Success -->
  <path d="M 250 230 L 300 230" stroke="#10B981" stroke-width="3" fill="none" marker-end="url(#arrowgreen)"/>
  <text x="275" y="220" font-size="10" text-anchor="middle" fill="#059669">Valid Token</text>
  
  <!-- Loading to Failure -->
  <path d="M 180 380 Q 365 450 550 380" stroke="#EF4444" stroke-width="3" fill="none" marker-end="url(#arrowred)"/>
  <text x="365" y="470" font-size="10" text-anchor="middle" fill="#DC2626">No/Invalid Token</text>
  
  <!-- Onboarding to Email -->
  <path d="M 750 230 L 800 230" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>
  <text x="775" y="220" font-size="9" text-anchor="middle" fill="#6B7280">Next</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10B981"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF4444"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <g transform="translate(50, 500)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#1F2937">Flow Details:</text>
    
    <text x="0" y="30" font-size="12" fill="#1F2937">1. App Launch / Page Refresh</text>
    <text x="20" y="50" font-size="10" fill="#6B7280">→ Loading screen appears immediately</text>
    <text x="20" y="65" font-size="10" fill="#6B7280">→ Check for stored tokens in secure storage</text>
    
    <text x="0" y="95" font-size="12" fill="#059669" font-weight="bold">2. Success Path (Valid Tokens)</text>
    <text x="20" y="115" font-size="10" fill="#6B7280">→ Validate access token with backend</text>
    <text x="20" y="130" font-size="10" fill="#6B7280">→ If valid: Navigate to Home Dashboard</text>
    <text x="20" y="145" font-size="10" fill="#6B7280">→ If expired: Auto-refresh with refresh token</text>
    <text x="20" y="160" font-size="10" fill="#6B7280">→ Update stored tokens and navigate to Home</text>
    
    <text x="0" y="190" font-size="12" fill="#DC2626" font-weight="bold">3. Failure Path (No/Invalid Tokens)</text>
    <text x="20" y="210" font-size="10" fill="#6B7280">→ No tokens found or both tokens invalid</text>
    <text x="20" y="225" font-size="10" fill="#6B7280">→ Clear any stored credentials</text>
    <text x="20" y="240" font-size="10" fill="#6B7280">→ Navigate to Onboarding screen</text>
    <text x="20" y="255" font-size="10" fill="#6B7280">→ User proceeds through normal login flow</text>
    
    <text x="500" y="30" font-size="12" fill="#1F2937" font-weight="bold">Key Features:</text>
    <text x="520" y="50" font-size="10" fill="#6B7280">✓ Seamless auto-login on refresh</text>
    <text x="520" y="65" font-size="10" fill="#6B7280">✓ Automatic token refresh</text>
    <text x="520" y="80" font-size="10" fill="#6B7280">✓ Loading state prevents screen flash</text>
    <text x="520" y="95" font-size="10" fill="#6B7280">✓ Secure storage (SecureStore/localStorage)</text>
    <text x="520" y="110" font-size="10" fill="#6B7280">✓ Graceful error handling</text>
    <text x="520" y="125" font-size="10" fill="#6B7280">✓ Debug logging for troubleshooting</text>
    
    <text x="500" y="155" font-size="12" fill="#1F2937" font-weight="bold">Timing:</text>
    <text x="520" y="175" font-size="10" fill="#6B7280">• Valid tokens: ~1 second</text>
    <text x="520" y="190" font-size="10" fill="#6B7280">• Token refresh: ~2 seconds</text>
    <text x="520" y="205" font-size="10" fill="#6B7280">• No tokens: ~1 second</text>
  </g>
</svg>
