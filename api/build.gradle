plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.10.6'
	id 'com.diffplug.spotless' version '8.1.0'
}

group = 'com.app.osmosis'
version = '0.0.1-SNAPSHOT'
description = 'Backend server for Osmosis project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "1.1.0")
	set('springCloudVersion', "2025.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
//	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
//	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
//	implementation 'org.springframework.ai:spring-ai-starter-model-vertex-ai-embedding'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation("com.google.api-client:google-api-client:2.7.2")
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.40.0'
	implementation 'io.jsonwebtoken:jjwt:0.13.0'

	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
//		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

def composeFile = 'src/main/resources/docker-compose.yml'

tasks.register('composeUp', Exec) {
	group = 'docker'
	description = "Start Docker Compose services using ${composeFile}"
	workingDir = projectDir

	commandLine 'docker', 'compose', '-f', composeFile, 'up', '-d', '--build'
	doLast {
		println "Docker Compose started using ${composeFile}"
	}
}

tasks.register('composeDown', Exec) {
	group = 'docker'
	description = "Stop and remove Docker Compose services using ${composeFile}"
	workingDir = projectDir
	commandLine 'docker', 'compose', '-f', composeFile, 'down', '--volumes', '--remove-orphans'
	doLast {
		println "Docker Compose stopped and removed services from ${composeFile}"
	}
}

spotless {
	java {
		// 1. Target: Updated to catch ALL java files (main, test, submodules)
		target 'src/**/*.java'

		// 2. Import Order: Define a logical order (Standard: Java -> Javax -> Org -> Com -> Local)
		// An empty string '' represents all other imports (local classes)
		importOrder('java', 'javax', 'org', 'com', '')

		// 3. Clean up imports
		removeUnusedImports()

		// 4. Formatter: CHOOSE ONE.
		// I recommend Google Java Format for backend engineering.
		// Using Prettier + GJF together is redundant and error-prone.
		googleJavaFormat('1.17.0')
				.aosp()  // Optional: Use 4-space indent (Android style) instead of Google's 2-space
				.reflowLongStrings()

		// 5. Annotations
		formatAnnotations()

		// 6. Extras (Added these for best practice)
		toggleOffOn()             // Allows you to use // spotless:off in code
		trimTrailingWhitespace()  // Removes trailing spaces
		endWithNewline()          // Ensures file ends with a newline

		// Note: 'cleanthat' is a code mutator, not just a formatter.
		// Only keep this if you specifically want it refactoring your logic.
		// cleanthat()
	}
}