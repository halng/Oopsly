plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.10.6'
	id 'com.diffplug.spotless' version '8.1.0'
	id 'jacoco'
	id 'org.barfuin.gradle.jacocolog' version '4.0.0'
	id "org.sonarqube" version "7.3.1.8318"
}
group = 'com.app.oopsly'
version = '0.0.1-SNAPSHOT'
description = 'Backend server for Oopsly project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

sonar {
  properties {
    property "sonar.projectKey", "Oopsly::API"
    property "sonar.organization", "tanhao111"
	property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
  }
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	all {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "1.1.0")
	set('springCloudVersion', "2025.0.0")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
//	implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
//	implementation 'org.springframework.ai:spring-ai-starter-model-vertex-ai-embedding'
//	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation("com.google.api-client:google-api-client:2.7.2")
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.40.0'
	implementation 'io.jsonwebtoken:jjwt:0.13.0'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// Caching & Caffeine
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// Resilience4j & AOP
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0' // Check for latest version
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// 4. Actuator (Optional but recommended for monitoring circuit state)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// openapi
	implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3")

	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.github.fppt:jedis-mock:1.1.8'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

dependencyManagement {
	imports {
//		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

// GraalVM AOT test processing is slow and pulls every @SpringBootTest into context; keep it off for local/CI unit+IT runs.
tasks.named('processTestAot').configure { enabled = false }

tasks.named('test') {
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.app.oopsly.api.unit.*'
	}
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

tasks.register('integrationTest', Test) {
	description = 'Runs controller-layer integration tests (H2 + embedded Redis, profile=integration)'
	group = 'verification'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	// Keep results/exec separate from unit :test so up-to-date checks and JaCoCo don't collide.
	binaryResultsDirectory = layout.buildDirectory.dir('test-results/integrationTest/binary')
	reports {
		junitXml.outputLocation = layout.buildDirectory.dir('test-results/integrationTest')
		html.outputLocation = layout.buildDirectory.dir('reports/tests/integrationTest')
	}
	filter {
		includeTestsMatching 'com.app.oopsly.api.integration.*'
		excludeTestsMatching 'com.app.oopsly.api.integration.support.*'
		setFailOnNoMatchingTests(true)
	}
	shouldRunAfter test
	testLogging {
		events 'passed', 'skipped', 'failed'
		exceptionFormat 'full'
	}
}

def composeFile = 'src/main/resources/docker-compose.yml'

tasks.register('composeUp', Exec) {
	group = 'docker'
	description = "Start Docker Compose services using ${composeFile}"
	workingDir = projectDir

	commandLine 'docker', 'compose', '-f', composeFile, 'up', '-d', '--build'
	doLast {
		println "Docker Compose started using ${composeFile}"
	}
}

tasks.register('composeDown', Exec) {
	group = 'docker'
	description = "Stop and remove Docker Compose services using ${composeFile}"
	workingDir = projectDir
	commandLine 'docker', 'compose', '-f', composeFile, 'down', '--volumes', '--remove-orphans'
	doLast {
		println "Docker Compose stopped and removed services from ${composeFile}"
	}
}

def jacocoExcludes = [
		'**/ApiApplication**',
		'**/Constant**',
		'**/viewmodel/**',
		'**/NoOpIEmailSender**',
		// Spring Security DSL lambdas are not unit-testable without full filter-chain boot
		'**/SecurityConfig**',
]

jacocoTestReport {
	dependsOn test

	classDirectories.setFrom(
			files(
					sourceSets.main.output.classesDirs.asFileTree.matching {
						exclude jacocoExcludes
					}
			)
	)

	executionData.setFrom(fileTree(dir: layout.buildDirectory.dir('jacoco'), includes: ['*.exec']))

	reports {
		xml.required = true
		csv.required = false
		html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
	}
}

jacoco {
	toolVersion = "0.8.13"
}

jacocoTestCoverageVerification {
	dependsOn test, integrationTest

	classDirectories.setFrom(
			files(
					sourceSets.main.output.classesDirs.asFileTree.matching {
						exclude jacocoExcludes
					}
			)
	)

	executionData.setFrom(fileTree(dir: layout.buildDirectory.dir('jacoco'), includes: ['*.exec']))

	violationRules {
		rule {
			enabled = true
			element = 'BUNDLE'
			limit {
				counter = 'CLASS'
				value = 'COVEREDRATIO'
				minimum = 0.9
			}
			limit {
				counter = 'METHOD'
				value = 'COVEREDRATIO'
				minimum = 0.9
			}
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.9
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.9
			}
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				minimum = 0.9
			}
			limit {
				counter = 'COMPLEXITY'
				value = 'COVEREDRATIO'
				minimum = 0.9
			}
		}
	}
}

tasks.jacocoTestCoverageVerification.finalizedBy('jacocoTestReport')
tasks.test.finalizedBy('jacocoTestReport')

spotless {
	java {
		target 'src/**/*.java'
		importOrder('java', 'javax', 'org', 'com', '')
		removeUnusedImports()
		googleJavaFormat('1.17.0')
				.aosp()
				.reflowLongStrings()
		formatAnnotations()
		toggleOffOn()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

def loadEnv() {
	// 1. Determine which profile to use
	// Check -Pprofile=xxx (Gradle property) or -Dspring.profiles.active=xxx (System property)
	def activeProfile = project.hasProperty('profile') ?
			project.property('profile') :
			System.getProperty('spring.profiles.active', 'prod')

	// 2. Determine file name: .env.test, .env.dev, or just .env for prod
	def envFileName = (activeProfile == 'prod') ? '.env' : ".env.${activeProfile}"
	def envFile = file(envFileName)

	if (envFile.exists()) {
		logger.lifecycle("🌱 Loading environment variables from: ${envFileName}")
		envFile.readLines().each { line ->
			// Improved regex to handle values with '=' (like connection strings)
			if (line.trim() && !line.startsWith('#') && line.contains('=')) {
				def parts = line.split('=', 2)
				def key = parts[0].trim()
				def value = parts[1].trim()
				System.setProperty(key, value)
			}
		}
	} else {
		logger.warn("⚠️ Environment file ${envFileName} not found, skipping loadEnv.")
	}
}

tasks.named('bootRun') {
	// Ensure we load the env before the process starts
	doFirst {
		loadEnv()
		// Pass System properties to the bootRun environment
		System.properties.each { k, v ->
			environment k.toString(), v.toString()
		}
	}
}