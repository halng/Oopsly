server:
  port: 9009
  active:
    version: v1
  servlet:
    context-path: /api/${server.active.version}/oopsly

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:057ba03d6c44104863dc7361fe4578965d1887360f90a0895882e58a6248fc86}
    expiration-in-ms: 86400000
    refresh-expiration-in-ms: 604800000
  google:
    client-id: ${GOOGLE_CLIENT_ID:changeme}
  features:
    authWithGoogle: false
    authWithJwt: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    operationsSorter: method

spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=10m
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude: org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration
  application:
    name: api
  main:
    allow-bean-definition-overriding: true

  datasource:
    password: ${DB_PASSWORD:postgres}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oopsly}
    username: ${DB_USERNAME:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 2000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: false
    show-sql: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:changeme@gmail.com}
    password: ${EMAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


resilience4j:
    circuitbreaker:
        configs:
          default:
            registerHealthIndicator: true
            slidingWindowSize: 100
            minimumNumberOfCalls: 10
            failureRateThreshold: 50
            waitDurationInOpenState: 5s
            record-exceptions:
              - java.io.IOException                       # Network/File IO issues
              - java.util.concurrent.TimeoutException     # Processing took too long
              - org.springframework.dao.DataAccessException # Covers most DB/JDBC errors (Spring)
              - org.springframework.data.redis.RedisConnectionFailureException # Redis down
              - org.springframework.web.client.HttpServerErrorException # Downstream service returned 500
              - com.app.oopsly.api.exception.SendEmailException # Custom email sending failure
            ignore-exceptions:
              - org.springframework.web.client.HttpClientErrorException # Downstream returned 400-404
              - com.app.oopsly.api.exception.NotFoundException   # Your custom input validation
              - com.app.oopsly.api.exception.UnauthenticatedException
              - com.app.oopsly.api.exception.ValidationException
              - com.app.oopsly.api.exception.RetryLaterException
              - java.lang.IllegalArgumentException        # Basic Java argument errors
        instances:
          userServiceCircuitBreaker:
            baseConfig: default
          collectionServiceCircuitBreaker:
            baseConfig: default
          cardServiceCircuitBreaker:
            baseConfig: default
          deckServiceCircuitBreaker:
            baseConfig: default
          otpServiceCircuitBreaker:
            baseConfig: default
          testSuiteServiceCircuitBreaker:
            baseConfig: default
          questionServiceCircuitBreaker:
            baseConfig: default
          subjectServiceCircuitBreaker:
            baseConfig: default
          shelveServiceCircuitBreaker:
            baseConfig: default
