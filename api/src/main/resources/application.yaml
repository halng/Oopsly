server:
  port: 9009
  active:
    version: v1
  servlet:
    context-path: /api/${server.active.version}/osmosis

app:
  jwt:
    secret: ${JWT_SECRET:changeme}
    expiration-in-ms: 86400000
    refresh-expiration-in-ms: 604800000
  google:
    client-id: ${GOOGLE_CLIENT_ID:changeme}
  features:
    authWithGoogle: false
    authWithJwt: true

spring:
  autoconfigure:
    exclude: org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration
  application:
    name: api
  main:
    allow-bean-definition-overriding: true

  datasource:
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:osmosis}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: create-drop
    generate-ddl: true
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:changeme@gmail.com}
    password: ${EMAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
      audio:
        transcription:
          options:
            model: whisper-1
        speech:
          options:
            model: tts-1

