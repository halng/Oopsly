server:
  port: 9009
  active:
    version: v1
  servlet:
    context-path: /api/${server.active.version}/oopsly

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-in-ms: 86400000
    refresh-expiration-in-ms: 604800000
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  features:
    authWithGoogle: false
    authWithJwt: true

spring:
  autoconfigure:
    exclude: org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration
  application:
    name: api
  main:
    allow-bean-definition-overriding: true

  datasource:
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oopsly}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

