server:
  port: 9009
  active:
    version: v1
  servlet:
    context-path: /api/${server.active.version}/osmosis

app:
  jwt:
    # JWT secret key (minimum 32 characters/256 bits required for HS256).
    # MUST be set via JWT_SECRET environment variable in production.
    secret: ${JWT_SECRET}
    # JWT expiration time in milliseconds (default: 24 hours).
    # Override per environment using JWT_EXPIRATION_IN_MS for better security (e.g., shorter in production).
    expiration-in-ms: ${JWT_EXPIRATION_IN_MS:86400000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:changeme}

spring:
  autoconfigure:
    exclude: org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration
  application:
    name: api
  main:
    allow-bean-definition-overriding: true

  datasource:
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:osmosis}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
