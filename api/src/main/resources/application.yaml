server:
  port: 9009
  active:
    version: v1
  servlet:
    context-path: /api/${server.active.version}/oopsly

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:changeme}
    expiration-in-ms: 86400000
    refresh-expiration-in-ms: 604800000
  google:
    client-id: ${GOOGLE_CLIENT_ID:changeme}
  features:
    authWithGoogle: false
    authWithJwt: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    operationsSorter: method

spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=10m
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude: org.springframework.ai.model.vertexai.autoconfigure.embedding.VertexAiTextEmbeddingAutoConfiguration
  application:
    name: api
  main:
    allow-bean-definition-overriding: true

  datasource:
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oopsly}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:changeme@gmail.com}
    password: ${EMAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


resilience4j:
    circuitbreaker:
        configs:
          default:
            registerHealthIndicator: true
            slidingWindowSize: 100
            minimumNumberOfCalls: 10
            failureRateThreshold: 50
            waitDurationInOpenState: 5s
        instances:
          userServiceCircuitBreaker:
            baseConfig: default
          collectionServiceCircuitBreaker:
            baseConfig: default
          cardServiceCircuitBreaker:
            baseConfig: default
          deckServiceCircuitBreaker:
            baseConfig: default
          otpServiceCircuitBreaker:
            baseConfig: default
          testSuiteServiceCircuitBreaker:
            baseConfig: default
          questionServiceCircuitBreaker:
            baseConfig: default
