spring:
  flyway:
    enabled: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        generate_statistics: true
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.stat: debug
