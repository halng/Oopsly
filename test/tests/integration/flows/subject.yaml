enabled: true
flows:
  - flow: Subject Management Flow
    description: "This flow tests subject CRUD operations including create, read, update, and delete operations"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.status
            type: equals
            value: 200
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelf
        api: SHELF_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_NAME: "Test Shelf for Subjects"
          SHELF_DESCRIPTION: "Shelf created for subject testing"
          SHELF_ICON: "book"
        assertions:
          - path: $.status
            type: equals
            value: 201
          - path: $.data.id
            type: not-null
        env-vars:
          SHELF_ID: $.data.id
    steps:
      - name: "1. Create a New Subject"
        api: SUBJECT_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_NAME: "Test Subject"
          SUBJECT_DESCRIPTION: "Subject for testing"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 201
          - path: $.data.id
            type: not-null
          - path: $.data.name
            type: equals
            value: "Test Subject"
        env-vars:
          SUBJECT_ID: $.data.id

      - name: "2. Get Subject by ID"
        api: SUBJECT_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.id
            type: equals
            value: ${SUBJECT_ID}
          - path: $.data.name
            type: equals
            value: "Test Subject"

      - name: "3. Update Subject"
        api: SUBJECT_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          SUBJECT_NAME: "Updated Subject"
          SUBJECT_DESCRIPTION: "Updated description"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.name
            type: equals
            value: "Updated Subject"

      - name: "4. Get All Subjects with Pagination"
        api: SUBJECT_GET_ALL_BY_SHELF
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          PAGE_NUM: "0"
          PAGE_SIZE: "10"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data
            type: not-null

      - name: "5. Delete Subject"
        api: SUBJECT_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

      - name: "6. Verify Subject is Deleted (Get by ID should fail)"
        api: SUBJECT_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

  - flow: Subject Edge Cases
    description: "Test edge cases for subject operations"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelf
        api: SHELF_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_NAME: "Edge Case Shelf"
          SHELF_DESCRIPTION: "Shelf for edge case testing"
          SHELF_ICON: "book"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SHELF_ID: $.data.id
    steps:
      - name: "1. Get Subject with Invalid ID"
        api: SUBJECT_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

      - name: "2. Update Non-existent Subject"
        api: SUBJECT_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: "00000000-0000-0000-0000-000000000000"
          SUBJECT_NAME: "Should Fail"
          SUBJECT_DESCRIPTION: "Should not work"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

      - name: "3. Delete Non-existent Subject"
        api: SUBJECT_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
