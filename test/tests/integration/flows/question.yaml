enabled: true
flows:
  - flow: Question Management Flow
    description: "This flow tests question CRUD operations within test suites"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelf
        api: SHELF_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_NAME: "Test Shelf for Questions"
          SHELF_DESCRIPTION: "Shelf created for question testing"
          SHELF_ICON: "book"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SHELF_ID: $.data.id
      - name: Create Test Suite
        api: TESTSUITE_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          TESTSUITE_TITLE: "Test Suite for Questions"
          TESTSUITE_IS_ACTIVE: true
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          TESTSUITE_ID: $.data.id
    steps:
      - name: "1. Create a New Multiple Choice Question"
        api: QUESTION_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_TEXT: "What is 2 + 2?"
          QUESTION_TYPE: "MULTIPLE_CHOICE"
          QUESTION_METADATA: >
            {
              "options": ["2", "3", "4", "5"],
              "correctAnswer": "4"
            }
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 201
          - path: $.data.id
            type: not-null
          - path: $.data.question
            type: contains
            value: "2 + 2"
        env-vars:
          QUESTION_ID: $.data.id
      
      - name: "2. Get Question by ID"
        api: QUESTION_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_ID: ${QUESTION_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.id
            type: equals
            value: ${QUESTION_ID}
          - path: $.data.type
            type: equals
            value: "MULTIPLE_CHOICE"
      
      - name: "3. Update Question"
        api: QUESTION_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_ID: ${QUESTION_ID}
          QUESTION_TEXT: "What is 3 + 3?"
          QUESTION_TYPE: "MULTIPLE_CHOICE"
          QUESTION_METADATA: >
            {
              "options": ["4", "5", "6", "7"],
              "correctAnswer": "6"
            }
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.question
            type: contains
            value: "3 + 3"
      
      - name: "4. Get All Questions by Test Suite"
        api: QUESTION_GET_ALL_BY_TESTSUITE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data
            type: not-null
      
      - name: "5. Delete Question"
        api: QUESTION_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_ID: ${QUESTION_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
      
      - name: "6. Verify Question is Deleted"
        api: QUESTION_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_ID: ${QUESTION_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

  - flow: Question Edge Cases and Multiple Types
    description: "Test edge cases and different question types"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelf
        api: SHELF_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_NAME: "Edge Case Shelf"
          SHELF_DESCRIPTION: "Shelf for edge case testing"
          SHELF_ICON: "book"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SHELF_ID: $.data.id
      - name: Create Test Suite
        api: TESTSUITE_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          TESTSUITE_TITLE: "Edge Case Test Suite"
          TESTSUITE_IS_ACTIVE: true
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          TESTSUITE_ID: $.data.id
    steps:
      - name: "1. Create True/False Question"
        api: QUESTION_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_TEXT: "Is the sky blue?"
          QUESTION_TYPE: "TRUE_FALSE"
          QUESTION_METADATA: >
            {
              "correctAnswer": "true"
            }
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 201
      
      - name: "2. Create Short Answer Question"
        api: QUESTION_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_TEXT: "What is the capital of Japan?"
          QUESTION_TYPE: "SHORT_ANSWER"
          QUESTION_METADATA: >
            {
              "correctAnswer": "Tokyo",
              "caseSensitive": false
            }
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 201
      
      - name: "3. Get Question with Invalid ID"
        api: QUESTION_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "4. Update Non-existent Question"
        api: QUESTION_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_ID: "00000000-0000-0000-0000-000000000000"
          QUESTION_TEXT: "Should fail"
          QUESTION_TYPE: "MULTIPLE_CHOICE"
          QUESTION_METADATA: "{}"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "5. Delete Non-existent Question"
        api: QUESTION_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: ${TESTSUITE_ID}
          QUESTION_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "6. Create Question with Invalid Test Suite ID"
        api: QUESTION_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          TESTSUITE_ID: "00000000-0000-0000-0000-000000000000"
          QUESTION_TEXT: "Should fail"
          QUESTION_TYPE: "MULTIPLE_CHOICE"
          QUESTION_METADATA: "{}"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
