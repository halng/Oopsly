flows:
  - flow: Card Management Flow
    description: "This flow tests card CRUD operations within collections"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelve
        api: SHELVE_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_NAME: "Test Shelve for Cards"
          SHELVE_DESCRIPTION: "Shelve created for card testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SHELVE_ID: $.data.id
      - name: Create Test Subject
        api: SUBJECT_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_NAME: "Test Subject for Cards"
          SUBJECT_DESCRIPTION: "Subject for card testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SUBJECT_ID: $.data.id
    steps:
      - name: "1. Create Cards in Subject"
        api: CARD_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARDS_ARRAY: >
            [
              {
                "question": "What is the capital of France?",
                "answer": "Paris",
                "hint": "City of lights"
              }
            ]
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data
            type: not-null
      
      - name: "2. Get All Cards in Subject with Pagination"
        api: CARD_GET_ALL_BY_COLLECTION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          PAGE_NUM: "0"
          PAGE_SIZE: "10"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.content
            type: not-null
        env-vars:
          CARD_ID: $.data.content[0].id
      
      - name: "3. Get Card by ID"
        api: CARD_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: ${CARD_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.id
            type: equals
            value: ${CARD_ID}
          - path: $.data.question
            type: contains
            value: "France"
      
      - name: "4. Update Card"
        api: CARD_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: ${CARD_ID}
          CARD_QUESTION: "What is the capital of Germany?"
          CARD_ANSWER: "Berlin"
          CARD_HINT: "German capital"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.question
            type: contains
            value: "Germany"
      
      - name: "5. Delete Card"
        api: CARD_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: ${CARD_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
      
      - name: "6. Verify Card is Deleted"
        api: CARD_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: ${CARD_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

  - flow: Card Edge Cases
    description: "Test edge cases for card operations"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelve
        api: SHELVE_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_NAME: "Edge Case Shelve"
          SHELVE_DESCRIPTION: "Shelve for edge case testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SHELVE_ID: $.data.id
      - name: Create Test Subject
        api: SUBJECT_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_NAME: "Edge Case Subject"
          SUBJECT_DESCRIPTION: "Subject for edge case testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SUBJECT_ID: $.data.id
    steps:
      - name: "1. Get Card with Invalid ID"
        api: CARD_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "2. Update Non-existent Card"
        api: CARD_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: "00000000-0000-0000-0000-000000000000"
          CARD_QUESTION: "Should fail"
          CARD_ANSWER: "Should not work"
          CARD_HINT: ""
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "3. Delete Non-existent Card"
        api: CARD_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "4. Get All Cards with Invalid Pagination"
        api: CARD_GET_ALL_BY_COLLECTION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          PAGE_NUM: "-1"
          PAGE_SIZE: "10"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 400
