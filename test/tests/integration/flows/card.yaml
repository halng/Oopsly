enabled: true
flows:
  - flow: Card Management Flow
    description: "This flow tests card CRUD operations within subjects"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelf
        api: SHELF_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_NAME: "Test Shelf for Cards"
          SHELF_DESCRIPTION: "Shelf created for card testing"
          SHELF_ICON: "book"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SHELF_ID: $.data.id
      - name: Create Test Subject
        api: SUBJECT_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_NAME: "Test Subject for Cards"
          SUBJECT_DESCRIPTION: "Subject for card testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SUBJECT_ID: $.data.id
    steps:
      - name: "1. Create Cards in Subject"
        api: CARD_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARDS_ARRAY:
            - front: "What is the capital of France?"
              back: "Paris"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data
            type: not-null

      - name: "2. Get All Cards in Subject with Pagination"
        api: CARD_GET_ALL_BY_SUBJECT
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          PAGE_NUM: "0"
          PAGE_SIZE: "10"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.entities
            type: not-null
        env-vars:
          CARD_ID: $.data.entities[0].id

      - name: "3. Get Card by ID"
        api: CARD_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: ${CARD_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.id
            type: equals
            value: ${CARD_ID}
          - path: $.data.front
            type: contains
            value: "France"

      - name: "4. Update Card"
        api: CARD_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: ${CARD_ID}
          CARD_FRONT: "What is the capital of Germany?"
          CARD_BACK: "Berlin"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.front
            type: contains
            value: "Germany"

      - name: "5. Delete Card"
        api: CARD_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: ${CARD_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

      - name: "6. Verify Card is Deleted"
        api: CARD_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: ${CARD_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

  - flow: Card Edge Cases
    description: "Test edge cases for card operations"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelf
        api: SHELF_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_NAME: "Edge Case Shelf"
          SHELF_DESCRIPTION: "Shelf for edge case testing"
          SHELF_ICON: "book"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SHELF_ID: $.data.id
      - name: Create Test Subject
        api: SUBJECT_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_NAME: "Edge Case Subject"
          SUBJECT_DESCRIPTION: "Subject for edge case testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SUBJECT_ID: $.data.id
    steps:
      - name: "1. Get Card with Invalid ID"
        api: CARD_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

      - name: "2. Update Non-existent Card"
        api: CARD_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: "00000000-0000-0000-0000-000000000000"
          CARD_FRONT: "Should fail"
          CARD_BACK: "Should not work"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

      - name: "3. Delete Non-existent Card"
        api: CARD_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          CARD_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

      - name: "4. Get All Cards with Invalid Pagination"
        api: CARD_GET_ALL_BY_SUBJECT
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELF_ID: ${SHELF_ID}
          SUBJECT_ID: ${SUBJECT_ID}
          PAGE_NUM: "-1"
          PAGE_SIZE: "10"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 400
