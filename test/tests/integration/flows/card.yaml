flows:
  - flow: Card Management Flow
    description: "This flow tests card CRUD operations within collections"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Deck
        api: DECK_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_NAME: "Test Deck for Cards"
          DECK_DESCRIPTION: "Deck created for card testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          DECK_ID: $.data.id
      - name: Create Test Collection
        api: COLLECTION_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_NAME: "Test Collection for Cards"
          COLLECTION_DESCRIPTION: "Collection for card testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          COLLECTION_ID: $.data.id
    steps:
      - name: "1. Create Cards in Collection"
        api: CARD_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          CARDS_ARRAY: [{"front": "What is the capital of France?","back": "Paris"}]
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 201
          - path: $.data
            type: not-null
      
      - name: "2. Get All Cards in Collection with Pagination"
        api: CARD_GET_ALL_BY_COLLECTION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          PAGE_NUM: "0"
          PAGE_SIZE: "10"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.entities
            type: not-null
        env-vars:
          CARD_ID: $.data.entities[0].id
      
      - name: "3. Get Card by ID"
        api: CARD_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          CARD_ID: ${CARD_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.id
            type: equals
            value: ${CARD_ID}
          - path: $.data.back
            type: equals
            value: "Paris"
          - path: $.data.front
            type: equals
            value: "What is the capital of France?"
      
      - name: "4. Update Card"
        api: CARD_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          CARD_ID: ${CARD_ID}
          CARD_QUESTION: "What is the capital of Germany?"
          CARD_ANSWER: "Berlin"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.back
            type: contains
            value: "Berlin"
      
      - name: "5. Delete Card"
        api: CARD_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          CARD_ID: ${CARD_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
      
      - name: "6. Verify Card is Deleted"
        api: CARD_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          CARD_ID: ${CARD_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

  - flow: Card Edge Cases
    description: "Test edge cases for card operations"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Deck
        api: DECK_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_NAME: "Edge Case Deck"
          DECK_DESCRIPTION: "Deck for edge case testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          DECK_ID: $.data.id
      - name: Create Test Collection
        api: COLLECTION_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_NAME: "Edge Case Collection"
          COLLECTION_DESCRIPTION: "Collection for edge case testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          COLLECTION_ID: $.data.id
    steps:
      - name: "1. Get Card with Invalid ID"
        api: CARD_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          CARD_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "2. Update Non-existent Card"
        api: CARD_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          CARD_ID: "00000000-0000-0000-0000-000000000000"
          CARD_QUESTION: "Should fail"
          CARD_ANSWER: "Should not work"
          CARD_HINT: ""
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "3. Delete Non-existent Card"
        api: CARD_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          CARD_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "4. Get All Cards with Invalid Pagination"
        api: CARD_GET_ALL_BY_COLLECTION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          COLLECTION_ID: ${COLLECTION_ID}
          PAGE_NUM: "-1"
          PAGE_SIZE: "10"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 400
