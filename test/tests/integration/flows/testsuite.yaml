flows:
  - flow: Test Suite Management Flow
    description: "This flow tests test suite CRUD operations within decks"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Deck
        api: DECK_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_NAME: "Test Deck for Test Suites"
          DECK_DESCRIPTION: "Deck created for test suite testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          DECK_ID: $.data.id
    steps:
      - name: "1. Create a New Test Suite"
        api: TESTSUITE_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          TESTSUITE_NAME: "Unit Test Suite"
          TESTSUITE_IS_ACTIVE: true
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 201
          - path: $.data.id
            type: not-null
          - path: $.data.title
            type: equals
            value: "Unit Test Suite"
          - path: $.data.isActive
            type: equals
            value: true
        env-vars:
          TESTSUITE_ID: $.data.id
      
      - name: "2. Get Test Suite by ID"
        api: TESTSUITE_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.id
            type: equals
            value: ${TESTSUITE_ID}
          - path: $.data.title
            type: equals
            value: "Unit Test Suite"
      
      - name: "3. Update Test Suite"
        api: TESTSUITE_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
          TESTSUITE_NAME: "Updated Test Suite"
          TESTSUITE_IS_ACTIVE: true
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.message
            type: equals
            value: "Test suite updated successfully"
      
      - name: "4. Get All Test Suites by Deck"
        api: TESTSUITE_GET_ALL_BY_DECK
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data
            type: not-null
      
      - name: "5. Delete Test Suite"
        api: TESTSUITE_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
      
      - name: "6. Verify Test Suite is Deleted"
        api: TESTSUITE_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

  - flow: Test Suite Edge Cases
    description: "Test edge cases for test suite operations"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Deck
        api: DECK_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_NAME: "Edge Case Deck"
          DECK_DESCRIPTION: "Deck for edge case testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          DECK_ID: $.data.id
    steps:
      - name: "1. Get Test Suite with Invalid ID"
        api: TESTSUITE_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          TESTSUITE_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "2. Update Non-existent Test Suite"
        api: TESTSUITE_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          TESTSUITE_ID: "00000000-0000-0000-0000-000000000000"
          TESTSUITE_NAME: "Should Fail"
          TESTSUITE_IS_ACTIVE: true
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "3. Delete Non-existent Test Suite"
        api: TESTSUITE_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: ${DECK_ID}
          TESTSUITE_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "4. Create Test Suite with Invalid Deck ID"
        api: TESTSUITE_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DECK_ID: "00000000-0000-0000-0000-000000000000"
          TESTSUITE_NAME: "Should Fail"
          TESTSUITE_IS_ACTIVE: false
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
