enabled: false
flows:
  - flow: Test Suite Management Flow
    description: "This flow tests test suite CRUD operations within shelves"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelve
        api: SHELVE_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ICON: "📚"
          SHELVE_NAME: "Test Shelve for Test Suites"
          SHELVE_DESCRIPTION: "Shelve created for test suite testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SHELVE_ID: $.data.id
    steps:
      - name: "1. Create a New Test Suite"
        api: TESTSUITE_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_NAME: "Unit Test Suite"
          TESTSUITE_DESCRIPTION: "Test suite for unit testing"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 201
          - path: $.data.id
            type: not-null
          - path: $.data.name
            type: equals
            value: "Unit Test Suite"
        env-vars:
          TESTSUITE_ID: $.data.id
      
      - name: "2. Get Test Suite by ID"
        api: TESTSUITE_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.id
            type: equals
            value: ${TESTSUITE_ID}
          - path: $.data.name
            type: equals
            value: "Unit Test Suite"
      
      - name: "3. Update Test Suite"
        api: TESTSUITE_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
          TESTSUITE_NAME: "Updated Test Suite"
          TESTSUITE_DESCRIPTION: "Updated description"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.name
            type: equals
            value: "Updated Test Suite"
      
      - name: "4. Get All Test Suites by Shelve"
        api: TESTSUITE_GET_ALL_BY_SHELVE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data
            type: not-null
      
      - name: "5. Delete Test Suite"
        api: TESTSUITE_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
      
      - name: "6. Verify Test Suite is Deleted"
        api: TESTSUITE_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404

  - flow: Test Suite Edge Cases
    description: "Test edge cases for test suite operations"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
      - name: Create Test Shelve
        api: SHELVE_CREATION
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ICON: "📚"
          SHELVE_NAME: "Edge Case Shelve"
          SHELVE_DESCRIPTION: "Shelve for edge case testing"
        assertions:
          - path: $.data.id
            type: not-null
        env-vars:
          SHELVE_ID: $.data.id
    steps:
      - name: "1. Create a Test Suite to Get Valid ID"
        api: TESTSUITE_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_NAME: "Edge Case Test Suite"
          TESTSUITE_DESCRIPTION: "Test suite for edge case testing"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 201
          - path: $.data.id
            type: not-null
        env-vars:
          TESTSUITE_ID: $.data.id
      
      - name: "2. Delete the Test Suite"
        api: TESTSUITE_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
      
      - name: "3. Get Test Suite with Deleted ID (should fail)"
        api: TESTSUITE_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "4. Update Deleted Test Suite (should fail)"
        api: TESTSUITE_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
          TESTSUITE_NAME: "Should Fail"
          TESTSUITE_DESCRIPTION: "Should not work"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "5. Delete Already Deleted Test Suite (should fail)"
        api: TESTSUITE_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: ${TESTSUITE_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "6. Get Test Suite with Invalid UUID (should fail)"
        api: TESTSUITE_GET_BY_ID
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "7. Update Test Suite with Invalid UUID (should fail)"
        api: TESTSUITE_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: "00000000-0000-0000-0000-000000000000"
          TESTSUITE_NAME: "Should Fail"
          TESTSUITE_DESCRIPTION: "Should not work"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "8. Delete Test Suite with Invalid UUID (should fail)"
        api: TESTSUITE_DELETE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: ${SHELVE_ID}
          TESTSUITE_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
      
      - name: "9. Create Test Suite with Invalid Shelve ID (should fail)"
        api: TESTSUITE_CREATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          SHELVE_ID: "00000000-0000-0000-0000-000000000000"
          TESTSUITE_NAME: "Should Fail"
          TESTSUITE_DESCRIPTION: "Should not work"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 404
