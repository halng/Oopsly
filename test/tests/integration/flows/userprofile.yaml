enabled: true
flows:
  - flow: User Profile Management Flow
    description: "This flow tests user profile operations including get and update"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
    steps:
      - name: "1. Get User Profile"
        api: USERPROFILE_GET
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data
            type: not-null

      - name: "2. Update User Profile"
        api: USERPROFILE_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DISPLAY_NAME: "Test User"
          BIO: "This is a test user profile"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.displayName
            type: equals
            value: "Test User"

      - name: "3. Get Updated Profile"
        api: USERPROFILE_GET
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.displayName
            type: equals
            value: "Test User"
          - path: $.data.bio
            type: contains
            value: "test user"

      - name: "4. Update User Profile with Partial Data"
        api: USERPROFILE_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DISPLAY_NAME: "Updated Test User"
          BIO: ""
          AGE: null
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

  - flow: User Settings Management Flow
    description: "This flow tests user settings operations"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
    steps:
      - name: "1. Update User Settings - Theme"
        api: USERSETTINGS_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          THEME: "dark"
          LANGUAGE: "en"
          SPACE_CONFIG:
            AGAIN: 1
            HARD: 2
            GOOD: 3
            EASY: 4
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

      - name: "2. Update User Settings - Language"
        api: USERSETTINGS_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          THEME: "light"
          LANGUAGE: "en"
          SPACE_CONFIG:
            AGAIN: 1
            HARD: 2
            GOOD: 3
            EASY: 4
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

      - name: "3. Update User Settings - System Theme"
        api: USERSETTINGS_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          THEME: "system"
          LANGUAGE: "en"
          SPACE_CONFIG:
            AGAIN: 1
            HARD: 2
            GOOD: 3
            EASY: 4
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

      - name: "4. Update All Settings at Once"
        api: USERSETTINGS_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          THEME: "light"
          LANGUAGE: "es"
          SPACE_CONFIG:
            AGAIN: 0
            HARD: 1
            GOOD: 2
            EASY: 3
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

  - flow: User Profile Edge Cases
    description: "Test edge cases for user profile operations"
    steps:
      - name: "1. Get Profile Without Authentication"
        api: USERPROFILE_GET
        with:
          AUTH_TOKEN: ""
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 401

      - name: "2. Update Profile Without Authentication"
        api: USERPROFILE_UPDATE
        with:
          AUTH_TOKEN: ""
          DISPLAY_NAME: "Should Fail"
          BIO: "Should not work"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 401

      - name: "3. Get Profile With Invalid Token"
        api: USERPROFILE_GET
        with:
          AUTH_TOKEN: "invalid-token-12345"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 401

  - flow: Profile and Settings Integration
    description: "Test combined profile and settings operations"
    before-all:
      - name: Generate OTP
        api: GENERATE_OTP
        with:
          EMAIL: integration@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      - name: Verify OTP and Obtain Tokens
        api: VERIFY_OTP
        with:
          EMAIL: integration@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.data.access_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
    steps:
      - name: "1. Get Initial Profile"
        api: USERPROFILE_GET
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

      - name: "2. Update Profile Information"
        api: USERPROFILE_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          DISPLAY_NAME: "Integration Tester"
          BIO: "Testing profile and settings integration"
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

      - name: "3. Update User Preferences"
        api: USERSETTINGS_UPDATE
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
          THEME: "dark"
          LANGUAGE: "en"
          SPACE_CONFIG:
            AGAIN: 1
            HARD: 2
            GOOD: 3
            EASY: 4
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

      - name: "4. Verify Profile Still Intact After Settings Update"
        api: USERPROFILE_GET
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.displayName
            type: equals
            value: "Integration Tester"
