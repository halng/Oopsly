flows:
  - flow: User Authentication Flow
    description: "This flow tests user authentication including token refresh and logout"
    steps:
      - name: "1. Generate OTP for User"
        api: GENERATE_OTP
        with:
          EMAIL: test@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
          - path: $.message
            type: contains
            value: "OTP sent successfully"
      
      - name: "2. Verify OTP and Obtain Tokens"
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.status
            type: equals
            value: 200
          - path: $.data.access_token
            type: not-null
          - path: $.data.refresh_token
            type: not-null
          - path: $.isSuccess
            type: equals
            value: true
        env-vars:
          AUTH_TOKEN: $.data.access_token
          REFRESH_TOKEN: $.data.refresh_token
          USER_EMAIL: $.data.user.email
          USER_ID: $.data.user.id
      
      - name: "3. Refresh Access Token"
        api: USER_REFRESH_TOKEN
        with:
          REFRESH_TOKEN: ${REFRESH_TOKEN}
          USER_EMAIL: ${USER_EMAIL}
          USER_ID: ${USER_ID}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
          - path: $.data.access_token
            type: not-null
          - path: $.data.refresh_token
            type: not-null
        env-vars:
          AUTH_TOKEN: $.data.access_token
          REFRESH_TOKEN: $.data.refresh_token
      
      - name: "4. Logout User"
        api: USER_LOGOUT
        with:
          AUTH_TOKEN: ${AUTH_TOKEN}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200

  - flow: User Authentication Edge Cases
    description: "Test edge cases for user authentication"
    steps:
      - name: "1. Generate OTP with Invalid Email Format"
        api: GENERATE_OTP
        with:
          EMAIL: "not-an-email"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 400
      
      - name: "2. Verify OTP with Incorrect Code"
        api: VERIFY_OTP
        with:
          EMAIL: test@oopsly.com
          OTP_CODE: "999999"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
      
      - name: "3. Refresh Token with Invalid Token"
        api: USER_REFRESH_TOKEN
        with:
          REFRESH_TOKEN: "invalid-token-string"
          USER_EMAIL: test@oopsly.com
          USER_ID: "00000000-0000-0000-0000-000000000000"
        assertions:
          - path: $.isSuccess
            type: equals
            value: false
          - path: $.status
            type: equals
            value: 401

  - flow: Multiple User Sessions
    description: "Test multiple user authentication sessions"
    steps:
      - name: "1. Generate OTP for First User"
        api: GENERATE_OTP
        with:
          EMAIL: user1@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      
      - name: "2. Generate OTP for Second User"
        api: GENERATE_OTP
        with:
          EMAIL: user2@oopsly.com
        assertions:
          - path: $.status
            type: equals
            value: 200
      
      - name: "3. Verify OTP for First User"
        api: VERIFY_OTP
        with:
          EMAIL: user1@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.status
            type: equals
            value: 200
          - path: $.data.access_token
            type: not-null
        env-vars:
          USER1_AUTH_TOKEN: $.data.access_token
          USER1_REFRESH_TOKEN: $.data.refresh_token
      
      - name: "4. Verify OTP for Second User"
        api: VERIFY_OTP
        with:
          EMAIL: user2@oopsly.com
          OTP_CODE: "000000"
        assertions:
          - path: $.status
            type: equals
            value: 200
          - path: $.data.access_token
            type: not-null
        env-vars:
          USER2_AUTH_TOKEN: $.data.access_token
          USER2_REFRESH_TOKEN: $.data.refresh_token
      
      - name: "5. Logout First User"
        api: USER_LOGOUT
        with:
          AUTH_TOKEN: ${USER1_AUTH_TOKEN}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
      
      - name: "6. Logout Second User"
        api: USER_LOGOUT
        with:
          AUTH_TOKEN: ${USER2_AUTH_TOKEN}
        assertions:
          - path: $.isSuccess
            type: equals
            value: true
          - path: $.status
            type: equals
            value: 200
