configs:
  environments:
    base_url: "http://localhost:9009/api/v1/oopsly"
  apis:
    # OTP AUTHENTICATION APIS
    - name: GENERATE_OTP
      method: POST
      endpoint: /otp
      headers:
        Content-Type: "application/json"
      query-params:
        email:
         value: $EMAIL
         constraints:
           nullable: false
    - name: VERIFY_OTP
      method: POST
      endpoint: /otp/validate
      headers:
          Content-Type: "application/json"
      body:
        email:
          value: $EMAIL
          constraints:
            nullable: false
        otp:
          value: $OTP_CODE
          constraints:
            length: 6
            nullable: false
    - name: REFRESH_AUTH_TOKEN
      method: POST
      endpoint: /auth/refresh-token
      headers:
        Content-Type: "application/json"
      body:
        refresh_token:
          value: $REFRESH_TOKEN
          constraints:
            nullable: false
#    USER AUTHENTICATION AND PROFILE APIS
    - name: TOKEN_REFRESH
      method: POST
      endpoint: /users/refresh-token
      headers:
        Content-Type: "application/json"
      body:
        refresh_token:
          value: $REFRESH_TOKEN
          constraints:
            nullable: false
        user_email:
          value: $EMAIL
          constraints:
              nullable: false

    # DECK MANAGEMENT APIS
    - name: DECK_CREATION
      method: POST
      endpoint: /decks
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $DECK_NAME
          constraints:
            nullable: false
        description:
          value: $DECK_DESCRIPTION
          constraints:
            length: [10, 100]
            nullable: false
    - name: DECK_UPDATE
      method: PUT
      endpoint: /decks/$DECK_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $DECK_NAME
          constraints:
            nullable: false
        description:
          value: $DECK_DESCRIPTION
          constraints:
            length: [10, 100]
            nullable: false
    - name: DECK_GET_BY_ID
      method: GET
      endpoint: /decks/$DECK_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: DECK_GET_ALL_WITH_PAGINATION
      method: GET
      endpoint: /decks
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
      query-params:
        page:
            value: $PAGE_NUM
            constraints:
                min: 1
        size:
            value: $PAGE_SIZE
            constraints:
                min: 1
                max: 100
    - name: DECK_DELETE
      method: PATCH
      endpoint: /decks/$DECK_ID
      headers:
          Authorization: "Bearer $AUTH_TOKEN"

    # COLLECTION MANAGEMENT APIS
    - name: COLLECTION_CREATE
      method: POST
      endpoint: /decks/$DECK_ID/collections
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $COLLECTION_NAME
          constraints:
            nullable: false
        description:
          value: $COLLECTION_DESCRIPTION
          constraints:
            nullable: true
    - name: COLLECTION_GET_ALL_BY_DECK
      method: GET
      endpoint: /decks/$DECK_ID/collections
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
      query-params:
        page:
          value: $PAGE_NUM
          constraints:
            min: 0
        size:
          value: $PAGE_SIZE
          constraints:
            min: 1
    - name: COLLECTION_UPDATE
      method: PUT
      endpoint: /decks/$DECK_ID/collections/$COLLECTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $COLLECTION_NAME
          constraints:
            nullable: false
        description:
          value: $COLLECTION_DESCRIPTION
          constraints:
            nullable: true
    - name: COLLECTION_GET_BY_ID
      method: GET
      endpoint: /decks/$DECK_ID/collections/$COLLECTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: COLLECTION_DELETE
      method: PATCH
      endpoint: /decks/$DECK_ID/collections/$COLLECTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # CARD MANAGEMENT APIS
    - name: CARD_CREATE
      method: POST
      endpoint: /decks/$DECK_ID/collections/$COLLECTION_ID/cards
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        cards:
          value: $CARDS_ARRAY
          constraints:
            type: array
            nullable: false
    - name: CARD_GET_ALL_BY_COLLECTION
      method: GET
      endpoint: /decks/$DECK_ID/collections/$COLLECTION_ID/cards
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
      query-params:
        page:
          value: $PAGE_NUM
          constraints:
            min: 0
        size:
          value: $PAGE_SIZE
          constraints:
            min: 1
    - name: CARD_UPDATE
      method: PUT
      endpoint: /decks/$DECK_ID/collections/$COLLECTION_ID/cards/$CARD_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        front:
          value: $CARD_QUESTION
          constraints:
            nullable: false
        back:
          value: $CARD_ANSWER
          constraints:
            nullable: false
    - name: CARD_GET_BY_ID
      method: GET
      endpoint: /decks/$DECK_ID/collections/$COLLECTION_ID/cards/$CARD_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: CARD_UPDATE_DIFFICULTY
      method: PUT
      endpoint: /decks/$DECK_ID/collections/$COLLECTION_ID/cards/difficulty
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        updates:
          value: $DIFFICULTY_UPDATES
          constraints:
            nullable: false
    - name: CARD_DELETE
      method: PATCH
      endpoint: /decks/$DECK_ID/collections/$COLLECTION_ID/cards/$CARD_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # TEST SUITE MANAGEMENT APIS
    - name: TESTSUITE_CREATE
      method: POST
      endpoint: /decks/$DECK_ID/test-suites
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        title:
          value: $TESTSUITE_NAME
          constraints:
            nullable: false
        isActive:
          value: $TESTSUITE_IS_ACTIVE
          constraints:
            nullable: false
    - name: TESTSUITE_UPDATE
      method: PUT
      endpoint: /decks/$DECK_ID/test-suites/$TESTSUITE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        title:
          value: $TESTSUITE_NAME
          constraints:
            nullable: false
        isActive:
          value: $TESTSUITE_IS_ACTIVE
          constraints:
            nullable: false
    - name: TESTSUITE_GET_BY_ID
      method: GET
      endpoint: /decks/$DECK_ID/test-suites/$TESTSUITE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: TESTSUITE_DELETE
      method: DELETE
      endpoint: /decks/$DECK_ID/test-suites/$TESTSUITE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: TESTSUITE_GET_ALL_BY_DECK
      method: GET
      endpoint: /decks/$DECK_ID/test-suites
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # QUESTION MANAGEMENT APIS
    - name: QUESTION_CREATE
      method: POST
      endpoint: /test-suites/$TESTSUITE_ID/questions
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        text:
          value: $QUESTION_TEXT
          constraints:
            nullable: false
        type:
          value: $QUESTION_TYPE
          constraints:
            nullable: false
        metadata:
          value: $QUESTION_METADATA
          constraints:
            type: string-json
            nullable: false
    - name: QUESTION_UPDATE
      method: PUT
      endpoint: /test-suites/$TESTSUITE_ID/questions/$QUESTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        text:
          value: $QUESTION_TEXT
          constraints:
            nullable: false
        type:
          value: $QUESTION_TYPE
          constraints:
            nullable: false
        metadata:
          value: $QUESTION_METADATA
          constraints:
            type: string-json
            nullable: false
    - name: QUESTION_GET_BY_ID
      method: GET
      endpoint: /test-suites/$TESTSUITE_ID/questions/$QUESTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: QUESTION_DELETE
      method: DELETE
      endpoint: /test-suites/$TESTSUITE_ID/questions/$QUESTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: QUESTION_GET_ALL_BY_TESTSUITE
      method: GET
      endpoint: /test-suites/$TESTSUITE_ID/questions
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # USER MANAGEMENT APIS
    - name: USER_REFRESH_TOKEN
      method: POST
      endpoint: /users/refresh-token
      headers:
        Content-Type: "application/json"
      body:
        refresh_token:
          value: $REFRESH_TOKEN
          constraints:
            nullable: false
        user_email:
          value: $USER_EMAIL
          constraints:
            nullable: false
    - name: USER_LOGOUT
      method: POST
      endpoint: /users/logout
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # USER PROFILE MANAGEMENT APIS
    - name: USERPROFILE_GET
      method: GET
      endpoint: /user/profile
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: USERPROFILE_UPDATE
      method: PATCH
      endpoint: /user/profile
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        displayName:
          value: $DISPLAY_NAME
          constraints:
            nullable: true
        bio:
          value: $BIO
          constraints:
            nullable: true
        avatarUrl:
          value: $AVATAR_URL
          constraints:
            nullable: true
    - name: USERSETTINGS_UPDATE
      method: PATCH
      endpoint: /user/settings
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        theme:
          value: $THEME
          constraints:
            nullable: true
        language:
          value: $LANGUAGE
          constraints:
            nullable: true
        spaceConfig:
          value: $SPACE_CONFIG
          constraints:
            type: object
            nullable: true