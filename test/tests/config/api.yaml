configs:
  environments:
    base_url: "http://localhost:9009/api/v1/oopsly"
  apis:
    # OTP AUTHENTICATION APIS (POST /otp?email=...)
    - name: GENERATE_OTP
      method: POST
      endpoint: /otp
      headers:
        Content-Type: "application/json"
      query-params:
        email:
          value: $EMAIL
          constraints:
            nullable: false
    - name: VERIFY_OTP
      method: POST
      endpoint: /otp/validate
      headers:
        Content-Type: "application/json"
      body:
        email:
          value: $EMAIL
          constraints:
            nullable: false
        otp:
          value: $OTP_CODE
          constraints:
            length: 6
            nullable: false

    # TOKEN VALIDATION
    - name: TOKEN_VALIDATE
      method: GET
      endpoint: /users/validate
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # USER AUTHENTICATION APIS
    - name: TOKEN_REFRESH
      method: POST
      endpoint: /users/refresh-token
      headers:
        Content-Type: "application/json"
      body:
        refresh_token:
          value: $REFRESH_TOKEN
          constraints:
            nullable: false
        user_email:
          value: $EMAIL
          constraints:
            nullable: false

    # SHELF MANAGEMENT APIS
    - name: SHELF_CREATION
      method: POST
      endpoint: /shelves
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        icon:
          value: $SHELF_ICON
          constraints:
            nullable: false
        name:
          value: $SHELF_NAME
          constraints:
            nullable: false
        description:
          value: $SHELF_DESCRIPTION
          constraints:
            length: [10, 100]
            nullable: false
    - name: SHELF_UPDATE
      method: PUT
      endpoint: /shelves/$SHELF_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        icon:
          value: $SHELF_ICON
          constraints:
            nullable: false
        name:
          value: $SHELF_NAME
          constraints:
            nullable: false
        description:
          value: $SHELF_DESCRIPTION
          constraints:
            length: [10, 100]
            nullable: false
    - name: SHELF_GET_BY_ID
      method: GET
      endpoint: /shelves/$SHELF_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: SHELF_GET_ALL
      method: GET
      endpoint: /shelves
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
      query-params:
        page:
          value: $PAGE_NUM
          constraints:
            min: 0
        size:
          value: $PAGE_SIZE
          constraints:
            min: 1
            max: 100
    - name: SHELF_DELETE
      method: PATCH
      endpoint: /shelves/$SHELF_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # SUBJECT MANAGEMENT APIS
    - name: SUBJECT_CREATE
      method: POST
      endpoint: /shelves/$SHELF_ID/subjects
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $SUBJECT_NAME
          constraints:
            nullable: false
        description:
          value: $SUBJECT_DESCRIPTION
          constraints:
            nullable: true
    - name: SUBJECT_GET_ALL_BY_SHELF
      method: GET
      endpoint: /shelves/$SHELF_ID/subjects
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
      query-params:
        page:
          value: $PAGE_NUM
          constraints:
            min: 0
        size:
          value: $PAGE_SIZE
          constraints:
            min: 1
    - name: SUBJECT_UPDATE
      method: PUT
      endpoint: /shelves/$SHELF_ID/subjects/$SUBJECT_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $SUBJECT_NAME
          constraints:
            nullable: false
        description:
          value: $SUBJECT_DESCRIPTION
          constraints:
            nullable: true
    - name: SUBJECT_GET_BY_ID
      method: GET
      endpoint: /shelves/$SHELF_ID/subjects/$SUBJECT_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: SUBJECT_DELETE
      method: PATCH
      endpoint: /shelves/$SHELF_ID/subjects/$SUBJECT_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # CARD MANAGEMENT APIS
    - name: CARD_CREATE
      method: POST
      endpoint: /shelves/$SHELF_ID/subjects/$SUBJECT_ID/cards
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        cards:
          value: $CARDS_ARRAY
          constraints:
            nullable: false
    - name: CARD_GET_ALL_BY_SUBJECT
      method: GET
      endpoint: /shelves/$SHELF_ID/subjects/$SUBJECT_ID/cards
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
      query-params:
        page:
          value: $PAGE_NUM
          constraints:
            min: 0
        size:
          value: $PAGE_SIZE
          constraints:
            min: 1
    - name: CARD_UPDATE
      method: PUT
      endpoint: /shelves/$SHELF_ID/subjects/$SUBJECT_ID/cards/$CARD_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        front:
          value: $CARD_FRONT
          constraints:
            nullable: false
        back:
          value: $CARD_BACK
          constraints:
            nullable: false
    - name: CARD_GET_BY_ID
      method: GET
      endpoint: /shelves/$SHELF_ID/subjects/$SUBJECT_ID/cards/$CARD_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: CARD_UPDATE_DIFFICULTY
      method: PUT
      endpoint: /shelves/$SHELF_ID/subjects/$SUBJECT_ID/cards/difficulty
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        updates:
          value: $DIFFICULTY_UPDATES
          constraints:
            nullable: false
    - name: CARD_DELETE
      method: PATCH
      endpoint: /shelves/$SHELF_ID/subjects/$SUBJECT_ID/cards/$CARD_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # TEST SUITE MANAGEMENT APIS
    - name: TESTSUITE_CREATE
      method: POST
      endpoint: /shelves/$SHELF_ID/test-suites
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        title:
          value: $TESTSUITE_TITLE
          constraints:
            nullable: false
        isActive:
          value: $TESTSUITE_IS_ACTIVE
          constraints:
            nullable: true
        subjectIds:
          value: $TESTSUITE_SUBJECT_IDS
          constraints:
            nullable: true
    - name: TESTSUITE_UPDATE
      method: PUT
      endpoint: /shelves/$SHELF_ID/test-suites/$TESTSUITE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        title:
          value: $TESTSUITE_TITLE
          constraints:
            nullable: false
        isActive:
          value: $TESTSUITE_IS_ACTIVE
          constraints:
            nullable: true
    - name: TESTSUITE_GET_BY_ID
      method: GET
      endpoint: /shelves/$SHELF_ID/test-suites/$TESTSUITE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: TESTSUITE_DELETE
      method: DELETE
      endpoint: /shelves/$SHELF_ID/test-suites/$TESTSUITE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: TESTSUITE_GET_ALL_BY_SHELF
      method: GET
      endpoint: /shelves/$SHELF_ID/test-suites
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: TESTSUITE_GET_CARDS
      method: GET
      endpoint: /test-suites/$TESTSUITE_ID/cards
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # QUESTION MANAGEMENT APIS
    - name: QUESTION_CREATE
      method: POST
      endpoint: /test-suites/$TESTSUITE_ID/questions
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        question:
          value: $QUESTION_TEXT
          constraints:
            nullable: false
        type:
          value: $QUESTION_TYPE
          constraints:
            nullable: false
        metadata:
          value: $QUESTION_METADATA
          constraints:
            nullable: true
    - name: QUESTION_UPDATE
      method: PUT
      endpoint: /test-suites/$TESTSUITE_ID/questions/$QUESTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        question:
          value: $QUESTION_TEXT
          constraints:
            nullable: false
        type:
          value: $QUESTION_TYPE
          constraints:
            nullable: false
        metadata:
          value: $QUESTION_METADATA
          constraints:
            nullable: true
    - name: QUESTION_GET_BY_ID
      method: GET
      endpoint: /test-suites/$TESTSUITE_ID/questions/$QUESTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: QUESTION_DELETE
      method: DELETE
      endpoint: /test-suites/$TESTSUITE_ID/questions/$QUESTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: QUESTION_GET_ALL_BY_TESTSUITE
      method: GET
      endpoint: /test-suites/$TESTSUITE_ID/questions
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # USER MANAGEMENT APIS
    - name: USER_REFRESH_TOKEN
      method: POST
      endpoint: /users/refresh-token
      headers:
        Content-Type: "application/json"
      body:
        refresh_token:
          value: $REFRESH_TOKEN
          constraints:
            nullable: false
        user_email:
          value: $USER_EMAIL
          constraints:
            nullable: false
    - name: USER_LOGOUT
      method: POST
      endpoint: /users/logout
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # USER PROFILE MANAGEMENT APIS
    - name: USERPROFILE_GET
      method: GET
      endpoint: /user/profile
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: USERPROFILE_UPDATE
      method: PATCH
      endpoint: /user/profile
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        displayName:
          value: $DISPLAY_NAME
          constraints:
            nullable: false
        bio:
          value: $BIO
          constraints:
            nullable: true
        age:
          value: $AGE
          constraints:
            nullable: true
    - name: USERSETTINGS_UPDATE
      method: PATCH
      endpoint: /user/settings
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        theme:
          value: $THEME
          constraints:
            nullable: false
        language:
          value: $LANGUAGE
          constraints:
            nullable: false
        spaceConfig:
          value: $SPACE_CONFIG
          constraints:
            nullable: false
