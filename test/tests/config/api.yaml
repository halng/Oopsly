configs:
  environments:
    base_url: "http://localhost:9009/api/v1/oopsly"
  apis:
    # OTP AUTHENTICATION APIS
    - name: GENERATE_OTP
      method: POST
      endpoint: /otp
      headers:
        Content-Type: "application/json"
      query-params:
        email:
         value: $EMAIL
         constraints:
           nullable: false
    - name: VERIFY_OTP
      method: POST
      endpoint: /otp/validate
      headers:
          Content-Type: "application/json"
      body:
        email:
          value: $EMAIL
          constraints:
            nullable: false
        otp:
          value: $OTP_CODE
          constraints:
            length: 6
            nullable: false
    - name: REFRESH_AUTH_TOKEN
      method: POST
      endpoint: /auth/refresh-token
      headers:
        Content-Type: "application/json"
      body:
        refresh_token:
          value: $REFRESH_TOKEN
          constraints:
            nullable: false
#    USER AUTHENTICATION AND PROFILE APIS
    - name: TOKEN_REFRESH
      method: POST
      endpoint: /users/refresh-token
      headers:
        Content-Type: "application/json"
      body:
        refresh_token:
          value: $REFRESH_TOKEN
          constraints:
            nullable: false
        user_email:
          value: $EMAIL
          constraints:
              nullable: false

    # SHELVE MANAGEMENT APIS
    - name: SHELVE_CREATION
      method: POST
      endpoint: /shelves
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $SHELVE_NAME
          constraints:
            nullable: false
        description:
          value: $SHELVE_DESCRIPTION
          constraints:
            length: [10, 100]
            nullable: false
    - name: SHELVE_UPDATE
      method: PUT
      endpoint: /shelves/$SHELVE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $SHELVE_NAME
          constraints:
            nullable: false
        description:
          value: $SHELVE_DESCRIPTION
          constraints:
            length: [10, 100]
            nullable: false
    - name: SHELVE_GET_BY_ID
      method: GET
      endpoint: /shelves/$SHELVE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: SHELVE_GET_ALL_WITH_PAGINATION
      method: GET
      endpoint: /shelves
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
      query-params:
        page:
            value: $PAGE_NUM
            constraints:
                min: 1
        size:
            value: $PAGE_SIZE
            constraints:
                min: 1
                max: 100
    - name: SHELVE_DELETE
      method: PATCH
      endpoint: /shelves/$SHELVE_ID
      headers:
          Authorization: "Bearer $AUTH_TOKEN"

    # SUBJECT MANAGEMENT APIS
    - name: SUBJECT_CREATE
      method: POST
      endpoint: /shelves/$SHELVE_ID/subjects
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $SUBJECT_NAME
          constraints:
            nullable: false
        description:
          value: $SUBJECT_DESCRIPTION
          constraints:
            nullable: true
    - name: SUBJECT_GET_ALL_BY_SHELVE
      method: GET
      endpoint: /shelves/$SHELVE_ID/subjects
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
      query-params:
        page:
          value: $PAGE_NUM
          constraints:
            min: 0
        size:
          value: $PAGE_SIZE
          constraints:
            min: 1
    - name: SUBJECT_UPDATE
      method: PUT
      endpoint: /shelves/$SHELVE_ID/subjects/$SUBJECT_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $SUBJECT_NAME
          constraints:
            nullable: false
        description:
          value: $SUBJECT_DESCRIPTION
          constraints:
            nullable: true
    - name: SUBJECT_GET_BY_ID
      method: GET
      endpoint: /shelves/$SHELVE_ID/subjects/$SUBJECT_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: SUBJECT_DELETE
      method: PATCH
      endpoint: /shelves/$SHELVE_ID/subjects/$SUBJECT_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # CARD MANAGEMENT APIS
    - name: CARD_CREATE
      method: POST
      endpoint: /shelves/$SHELVE_ID/subjects/$SUBJECT_ID/cards
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        cards:
          value: $CARDS_ARRAY
          constraints:
            nullable: false
    - name: CARD_GET_ALL_BY_COLLECTION
      method: GET
      endpoint: /shelves/$SHELVE_ID/subjects/$SUBJECT_ID/cards
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
      query-params:
        page:
          value: $PAGE_NUM
          constraints:
            min: 0
        size:
          value: $PAGE_SIZE
          constraints:
            min: 1
    - name: CARD_UPDATE
      method: PUT
      endpoint: /shelves/$SHELVE_ID/subjects/$SUBJECT_ID/cards/$CARD_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        question:
          value: $CARD_QUESTION
          constraints:
            nullable: false
        answer:
          value: $CARD_ANSWER
          constraints:
            nullable: false
        hint:
          value: $CARD_HINT
          constraints:
            nullable: true
    - name: CARD_GET_BY_ID
      method: GET
      endpoint: /shelves/$SHELVE_ID/subjects/$SUBJECT_ID/cards/$CARD_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: CARD_UPDATE_DIFFICULTY
      method: PUT
      endpoint: /shelves/$SHELVE_ID/subjects/$SUBJECT_ID/cards/difficulty
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        updates:
          value: $DIFFICULTY_UPDATES
          constraints:
            nullable: false
    - name: CARD_DELETE
      method: PATCH
      endpoint: /shelves/$SHELVE_ID/subjects/$SUBJECT_ID/cards/$CARD_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # TEST SUITE MANAGEMENT APIS
    - name: TESTSUITE_CREATE
      method: POST
      endpoint: /shelves/$SHELVE_ID/test-suites
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $TESTSUITE_NAME
          constraints:
            nullable: false
        description:
          value: $TESTSUITE_DESCRIPTION
          constraints:
            nullable: true
    - name: TESTSUITE_UPDATE
      method: PUT
      endpoint: /shelves/$SHELVE_ID/test-suites/$TESTSUITE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        name:
          value: $TESTSUITE_NAME
          constraints:
            nullable: false
        description:
          value: $TESTSUITE_DESCRIPTION
          constraints:
            nullable: true
    - name: TESTSUITE_GET_BY_ID
      method: GET
      endpoint: /shelves/$SHELVE_ID/test-suites/$TESTSUITE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: TESTSUITE_DELETE
      method: DELETE
      endpoint: /shelves/$SHELVE_ID/test-suites/$TESTSUITE_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: TESTSUITE_GET_ALL_BY_DECK
      method: GET
      endpoint: /shelves/$SHELVE_ID/test-suites
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # QUESTION MANAGEMENT APIS
    - name: QUESTION_CREATE
      method: POST
      endpoint: /test-suites/$TESTSUITE_ID/questions
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        question:
          value: $QUESTION_TEXT
          constraints:
            nullable: false
        type:
          value: $QUESTION_TYPE
          constraints:
            nullable: false
        metadata:
          value: $QUESTION_METADATA
          constraints:
            nullable: true
    - name: QUESTION_UPDATE
      method: PUT
      endpoint: /test-suites/$TESTSUITE_ID/questions/$QUESTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        question:
          value: $QUESTION_TEXT
          constraints:
            nullable: false
        type:
          value: $QUESTION_TYPE
          constraints:
            nullable: false
        metadata:
          value: $QUESTION_METADATA
          constraints:
            nullable: true
    - name: QUESTION_GET_BY_ID
      method: GET
      endpoint: /test-suites/$TESTSUITE_ID/questions/$QUESTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: QUESTION_DELETE
      method: DELETE
      endpoint: /test-suites/$TESTSUITE_ID/questions/$QUESTION_ID
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: QUESTION_GET_ALL_BY_TESTSUITE
      method: GET
      endpoint: /test-suites/$TESTSUITE_ID/questions
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # USER MANAGEMENT APIS
    - name: USER_REFRESH_TOKEN
      method: POST
      endpoint: /users/refresh-token
      headers:
        Content-Type: "application/json"
      body:
        refreshToken:
          value: $REFRESH_TOKEN
          constraints:
            nullable: false
        userEmail:
          value: $USER_EMAIL
          constraints:
            nullable: false
        userId:
          value: $USER_ID
          constraints:
            nullable: false
    - name: USER_LOGOUT
      method: POST
      endpoint: /users/logout
      headers:
        Authorization: "Bearer $AUTH_TOKEN"

    # USER PROFILE MANAGEMENT APIS
    - name: USERPROFILE_GET
      method: GET
      endpoint: /user/profile
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
    - name: USERPROFILE_UPDATE
      method: PATCH
      endpoint: /user/profile
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        displayName:
          value: $DISPLAY_NAME
          constraints:
            nullable: true
        bio:
          value: $BIO
          constraints:
            nullable: true
        avatarUrl:
          value: $AVATAR_URL
          constraints:
            nullable: true
    - name: USERSETTINGS_UPDATE
      method: PATCH
      endpoint: /user/settings
      headers:
        Authorization: "Bearer $AUTH_TOKEN"
        Content-Type: "application/json"
      body:
        theme:
          value: $THEME
          constraints:
            nullable: true
        language:
          value: $LANGUAGE
          constraints:
            nullable: true
        notifications:
          value: $NOTIFICATIONS
          constraints:
            nullable: true