version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: oopsly_test
    ports:
      - "5433:5432"  # Use different port to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Redis Cache
  redis:
    image: docker.io/bitnami/redis:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - "6380:6379"  # Use different port to avoid conflicts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # API Server (built from local Dockerfile)
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oopsly_test
      DB_USERNAME: postgres
      DB_PASSWORD: testpassword
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # JWT Configuration
      JWT_SECRET: test_jwt_secret_min_256_bits_for_integration_testing_purposes_only
      
      # Email Configuration (mock)
      EMAIL_USERNAME: test@example.com
      EMAIL_PASSWORD: testpassword
      
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      
      # Spring Profile
      SPRING_PROFILES_ACTIVE: test
    ports:
      - "9009:9009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9009/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
